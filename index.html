<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigrama Estudio Afín | Roles y Estructura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F6F3EE;
      color: #4A4643;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    .role-card {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .role-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -6px rgba(90, 82, 76, 0.12);
      border-color: #8C3B46;
    }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate {
      animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #EFEAE2; }
    ::-webkit-scrollbar-thumb { background: #CFC7BC; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HEADER MINIMALISTA SUAVE -->
  <header class="bg-[#EAE3D8] text-[#4A4643] border-b border-[#DCD4C8] sticky top-0 z-30">
    <div class="max-w-[1440px] mx-auto px-4 md:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
      
      <!-- Título Oficial -->
      <div>
        <h1 class="font-serif-title text-lg md:text-xl font-bold tracking-tight text-[#3E3A37]">
          Organigrama Estudio Afín <span class="text-[#7E7872] font-normal text-sm md:text-base">| Roles y Estructura</span>
        </h1>
      </div>

      <!-- Controles Limpios -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Selector de Etapa (Hoy vs Escala) -->
        <div class="bg-[#DFD7CB] p-1 rounded-lg border border-[#D1C8BA] flex items-center text-xs">
          <button onclick="setStage('hoy')" id="btn-stage-hoy" class="px-3 py-1 rounded-md font-medium transition-all bg-[#7D343E] text-[#FAF8F5] shadow-sm">
            Hoy
          </button>
          <button onclick="setStage('escala')" id="btn-stage-escala" class="px-3 py-1 rounded-md font-medium transition-all text-[#68625C] hover:text-[#3E3A37]">
            Escala
          </button>
        </div>

        <!-- Interruptor Auditoría Ácida -->
        <button onclick="toggleAudit()" id="btn-audit" class="px-2.5 py-1.5 rounded-lg border border-[#D1C8BA] bg-[#F5F1EB] text-[#68625C] hover:text-[#3E3A37] text-xs font-medium transition-all">
          Auditoría: OFF
        </button>

        <!-- Selector PC / Móvil -->
        <div class="bg-[#DFD7CB] p-1 rounded-lg border border-[#D1C8BA] flex items-center text-xs">
          <button onclick="setDeviceMode('desktop')" id="btn-view-desktop" class="px-2.5 py-1 rounded-md font-medium transition-all bg-[#FAF8F5] text-[#4A4643] shadow-sm">
            PC
          </button>
          <button onclick="setDeviceMode('mobile')" id="btn-view-mobile" class="px-2.5 py-1 rounded-md font-medium transition-all text-[#68625C] hover:text-[#3E3A37]">
            Móvil
          </button>
        </div>
      </div>
    </div>

    <!-- Barra secundaria compacta -->
    <div class="bg-[#F3EFE8] text-[#5C5752] border-b border-[#E2DBD0] px-4 md:px-6 py-2">
      <div class="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">
        <div id="dept-filters" class="flex items-center gap-1.5 overflow-x-auto pb-0.5 md:pb-0">
          <!-- Render dinámico -->
        </div>
        <div id="load-summary" class="flex items-center gap-3 text-[11px] text-[#78726C]">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL A PANTALLA COMPLETA -->
  <main class="flex-1 max-w-[1440px] w-full mx-auto px-4 md:px-6 py-6">
    <div id="org-canvas" class="w-full">
      <!-- Renderizado dinámico PC o Móvil -->
    </div>
  </main>

  <!-- TARJETA FLOTANTE (MODAL) AL PINCHAR UN ROL -->
  <div id="floating-modal" onclick="handleBackdropClick(event)" class="hidden fixed inset-0 z-50 bg-[#6E6862]/35 backdrop-blur-[2px] flex items-center justify-center p-4">
    <div class="modal-animate w-full max-w-lg max-h-[88vh] overflow-y-auto bg-[#FCFBF9] rounded-2xl border border-[#DED7CC] shadow-xl p-5 md:p-6">
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const DEPARTMENTS = [
      { id: 'COM', name: 'Comercial & Cliente', color: '#7D343E' },
      { id: 'DIS', name: 'Diseño Estratégico', color: '#A35C64' },
      { id: 'LOG', name: 'Operaciones & Logística', color: '#7C7A78' },
      { id: 'TER', name: 'Montaje & Terreno', color: '#948B82' },
      { id: 'FIN', name: 'Admin & Finanzas', color: '#B39C82' }
    ];

    const LEVELS = [
      { id: 1, title: 'Nivel 1 · Dirección de Área' },
      { id: 2, title: 'Nivel 2 · Liderazgo Operativo' },
      { id: 3, title: 'Nivel 3 · Ejecución y Apoyo' },
      { id: 4, title: 'Nivel 4 · Aliados Externos' }
    ];

    const SOP_DETAILS = {
      'COM-01': 'Filtro de calificación (CAPEX, plazos y exclusión de anti-clientes) y firma de contrato.',
      'COM-02': 'Correo como único canal vinculante, SLAs de respuesta y órdenes de cambio pagadas por adelantado.',
      'COM-03': 'Inspección final, entrega de dossier a Property Manager, Welcome Book y cobro del 20% final.',
      'DIS-01': 'Levantamiento, Moodboard de conversión (máx. 2 revisiones) y matriz de compras FF&E Open Book.',
      'LOG-01': 'Órdenes de compra tras Hito 2 (30%), acopio transitorio y control de calidad antes de firmar guía.',
      'LOG-02': 'Control excepcional de mueblistas externos homologados: muestras físicas y tolerancia +/- 2 mm.',
      'TER-01': 'Permisos en conserjería 48h antes, protección de ascensores y retiro total de embalajes el mismo día.',
      'TER-02': 'Aseo profundo, montaje escénico (Styling) y pauta fotográfica estándar para Airbnb/Booking.',
      'FIN-01': 'Calendario inamovible 50%-30%-20%, regla de cero financiamiento propio y rendición Open Book.'
    };

    // NIVEL 0: GERENCIA GENERAL (SOCIAS FUNDADORAS)
    const EXECUTIVE_ROLE = {
      id: 'gerencia-general',
      dept: 'DIR',
      deptName: 'Gobierno Corporativo',
      color: '#7D343E',
      level: 0,
      title: 'Gerencia General · Socias Fundadoras',
      subtitle: 'Dirección Ejecutiva, Visión Estratégica y Toma de Decisiones Finales',
      mission: 'Liderar la estrategia global de Estudio Afín, aprobar alianzas clave, custodiar la cultura corporativa y dirigir las 5 áreas operativas de la empresa.',
      audit: 'Estructura bicéfala ejecutiva en la cúspide (Nivel 0). En etapa inicial, la Gerencia General absorbe la dirección de las áreas clave antes de delegar mandos medios.',
      sops: ['COM-01', 'DIS-01', 'FIN-01'],
      kpis: ['7 proyectos/año', 'CSAT > 85%', 'NPS 9–10']
    };

    let rolesData = [
      // NIVEL 1
      {
        id: 'com-dir', dept: 'COM', level: 1,
        title: 'Dirección Comercial & Cuentas',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Liderar alianzas B2B con Property Managers, filtrar inversionistas y cerrar contratos.',
        audit: 'Fusión total de prospección, cuentas y cierre comercial en un solo liderazgo.',
        sops: ['COM-01', 'COM-02'],
        kpis: ['7 proyectos/año', 'NPS 9–10']
      },
      {
        id: 'dis-dir', dept: 'DIS', level: 1,
        title: 'Dirección Creativa & FF&E',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Definir el concepto visual adaptado al entorno y aprobar el presupuesto FF&E.',
        audit: 'Elimina renders 3D lentos; prioriza Moodboards ágiles orientados a conversión.',
        sops: ['DIS-01'],
        kpis: ['Máx. 2 rondas revisión', 'Lead Time diseño']
      },
      {
        id: 'log-dir', dept: 'LOG', level: 1,
        title: 'Dirección de Operaciones',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Controlar cadena de abastecimiento, negociar con proveedores y velar por plazos.',
        audit: 'Absorbe dirección de compras y control de proveedores bajo una sola cabeza.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Cumplimiento proveedores', 'Cero quiebres']
      },
      {
        id: 'ter-dir', dept: 'TER', level: 1,
        title: 'Dirección de Montaje',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Asegurar ejecución llave en mano sin fricciones en edificios y entrega conforme.',
        audit: 'Unificada junto a Operaciones para evitar brechas entre compra y obra.',
        sops: ['TER-01', 'COM-03'],
        kpis: ['CSAT > 85%', 'Entrega en fecha']
      },
      {
        id: 'fin-dir', dept: 'FIN', level: 1,
        title: 'Dirección Financiera & Control',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Custodiar flujo de caja por hitos (50-30-20), aprobar pagos y validar rentabilidad.',
        audit: 'Regla estricta de cero financiamiento propio del mobiliario.',
        sops: ['FIN-01'],
        kpis: ['Variación CAPEX ~ 0%', 'Margen markup']
      },

      // NIVEL 2
      {
        id: 'com-lead', dept: 'COM', level: 2,
        title: 'Ejecutivo Comercial & Handover',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Gestionar comunicaciones oficiales, órdenes de cambio y entrega de llaves.',
        audit: 'Fusiona Onboarding + Gestión de Cambios + Handover en una sola persona.',
        sops: ['COM-01', 'COM-02', 'COM-03'],
        kpis: ['SLA respuesta < 8h', 'CSAT Handover']
      },
      {
        id: 'dis-lead', dept: 'DIS', level: 2,
        title: 'Diseñador/a FF&E Senior',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Ejecutar levantamiento en terreno, armar Moodboards y cerrar matriz de compra.',
        audit: 'Absorbe interiorismo + especificación técnica en un perfil integral.',
        sops: ['DIS-01'],
        kpis: ['85–90% compra retail', 'Precisión medidas']
      },
      {
        id: 'log-lead', dept: 'LOG', level: 2,
        title: 'Líder de Procura & Acopio',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Emitir órdenes de compra, recibir despachos con checklist y coordinar bodega.',
        audit: 'Contratación prioritaria #1 en crecimiento para liberar carga operativa.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Rechazo en 24h', '0 mermas en bodega']
      },
      {
        id: 'ter-lead', dept: 'TER', level: 2,
        title: 'Supervisor/a de Obra & Styling',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Coordinar permisos en conserjería, supervisar maestros y dirigir styling final.',
        audit: 'Fusiona supervisión técnica en obra + dirección de arte fotográfica.',
        sops: ['TER-01', 'TER-02'],
        kpis: ['Obra limpia 100%', '0 multas edificio']
      },
      {
        id: 'fin-lead', dept: 'FIN', level: 2,
        title: 'Control de Gestión & Open Book',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Emitir facturas por hitos, rendir boletas Open Book y controlar márgenes.',
        audit: 'Se mantiene interno hasta escala; contabilidad tributaria va 100% externa.',
        sops: ['FIN-01'],
        kpis: ['Cobro 100% pre-compra', 'Cierre Open Book']
      },

      // NIVEL 3
      {
        id: 'dis-exec', dept: 'DIS', level: 3,
        title: 'Asistente Diseño & Cotizaciones',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Armar láminas de Moodboard, verificar stock en tiendas y actualizar planillas.',
        audit: 'Contratación de apoyo en crecimiento para liberar horas operativas de diseño.',
        sops: ['DIS-01'],
        kpis: ['Stock validado 100%', 'Cotización < 48h']
      },
      {
        id: 'ter-exec', dept: 'TER', level: 3,
        title: 'Coordinador Logística & Montaje',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Ejecutar recepciones físicas, proteger ascensores y asistir armado en terreno.',
        audit: 'Rol puente compartido entre Logística y Terreno para evitar tiempos muertos.',
        sops: ['LOG-01', 'TER-01'],
        kpis: ['Checklist 100% firmado', 'Retiro cartones día 1']
      },

      // NIVEL 4 (EXTERNOS VARIABLES)
      {
        id: 'log-ext', dept: 'LOG', level: 4,
        title: 'Talleres Externos & Bodega',
        status: { hoy: 'Externo', escala: 'Externo' },
        mission: 'Fabricar piezas especiales bajo plano y proveer acopio temporal por proyecto.',
        audit: 'Cero taller carpintero propio (costo fijo eliminado). Pago 100% variable.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Tolerancia +/- 2mm', 'Entrega puntual']
      },
      {
        id: 'ter-ext', dept: 'TER', level: 4,
        title: 'Cuadrillas, Aseo & Fotografía',
        status: { hoy: 'Externo', escala: 'Externo' },
        mission: 'Ejecutar pintura, instalaciones, aseo profundo y fotografía comercial Airbnb.',
        audit: 'Equipos variables contratados por obra bajo protocolo de Obra Limpia.',
        sops: ['TER-01', 'TER-02'],
        kpis: ['0 daños áreas comunes', 'Fotos listas en 48h']
      },
      {
        id: 'fin-ext', dept: 'FIN', level: 4,
        title: 'Contador & Asesor Tributario',
        status: { hoy: 'Externo', escala: 'Externo' },
        mission: 'Llevar contabilidad mensual, declaraciones F29/Renta y cumplimiento SII.',
        audit: 'Externalizado desde el día 1 mediante fee mensual fijo.',
        sops: ['FIN-01'],
        kpis: ['0 multas SII', 'Balance al día']
      }
    ];

    let state = {
      stage: 'hoy',
      showAudit: false,
      activeDept: 'ALL',
      selectedRoleId: null,
      deviceMode: window.innerWidth < 860 ? 'mobile' : 'desktop'
    };

    function getStatusStyle(status) {
      if (status === 'Interno') return { bg: 'bg-[#736E6A]', text: 'text-[#FAF8F5]', label: 'Equipo Interno' };
      if (status === 'Externo') return { bg: 'bg-[#EAE2D6]', text: 'text-[#5C544B]', label: 'Externo variable' };
      return { bg: 'bg-[#F8EFEF] border border-dashed border-[#9E525C]', text: 'text-[#7D343E]', label: 'Por contratar' };
    }

    function setStage(stage) {
      state.stage = stage;
      ['hoy', 'escala'].forEach(s => {
        const btn = document.getElementById(`btn-stage-${s}`);
        btn.className = s === stage
          ? 'px-3 py-1 rounded-md font-medium transition-all bg-[#7D343E] text-[#FAF8F5] shadow-sm'
          : 'px-3 py-1 rounded-md font-medium transition-all text-[#68625C] hover:text-[#3E3A37]';
      });
      renderAll();
    }

    function toggleAudit() {
      state.showAudit = !state.showAudit;
      const btn = document.getElementById('btn-audit');
      btn.textContent = state.showAudit ? 'Auditoría: ON' : 'Auditoría: OFF';
      btn.className = state.showAudit
        ? 'px-2.5 py-1.5 rounded-lg border border-[#7D343E] bg-[#7D343E] text-[#FAF8F5] text-xs font-medium transition-all shadow-sm'
        : 'px-2.5 py-1.5 rounded-lg border border-[#D1C8BA] bg-[#F5F1EB] text-[#68625C] hover:text-[#3E3A37] text-xs font-medium transition-all';
      renderAll();
    }

    function setDeviceMode(mode) {
      state.deviceMode = mode;
      document.getElementById('btn-view-desktop').className = mode === 'desktop'
        ? 'px-2.5 py-1 rounded-md font-medium transition-all bg-[#FAF8F5] text-[#4A4643] shadow-sm'
        : 'px-2.5 py-1 rounded-md font-medium transition-all text-[#68625C] hover:text-[#3E3A37]';
      document.getElementById('btn-view-mobile').className = mode === 'mobile'
        ? 'px-2.5 py-1 rounded-md font-medium transition-all bg-[#FAF8F5] text-[#4A4643] shadow-sm'
        : 'px-2.5 py-1 rounded-md font-medium transition-all text-[#68625C] hover:text-[#3E3A37]';
      renderAll();
    }

    function setDeptFilter(deptId) {
      state.activeDept = deptId;
      renderAll();
    }

    function openRoleModal(roleId) {
      state.selectedRoleId = roleId;
      renderModal();
    }

    function closeModal() {
      state.selectedRoleId = null;
      document.getElementById('floating-modal').classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'floating-modal') {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.selectedRoleId) {
        closeModal();
      }
    });

    function changeRoleStatus(roleId, newStatus) {
      const role = rolesData.find(r => r.id === roleId);
      if (role) {
        role.status[state.stage] = newStatus;
        renderAll();
      }
    }

    function renderFiltersAndSummary() {
      const filtersEl = document.getElementById('dept-filters');
      const allActive = state.activeDept === 'ALL';
      let html = `
        <button onclick="setDeptFilter('ALL')" class="px-2.5 py-1 rounded-md font-medium transition-all shrink-0 ${allActive ? 'bg-[#736E6A] text-[#FAF8F5]' : 'text-[#68625C] hover:bg-[#E6DFD5]'}">
          Todas las áreas (5)
        </button>
      `;
      DEPARTMENTS.forEach(d => {
        const active = state.activeDept === d.id;
        html += `
          <button onclick="setDeptFilter('${d.id}')" class="px-2.5 py-1 rounded-md font-medium transition-all flex items-center gap-1.5 shrink-0 ${active ? 'bg-[#FCFBF9] text-[#3E3A37] shadow-sm border border-[#D4CCC0]' : 'text-[#68625C] hover:bg-[#E6DFD5]'}">
            <span class="w-2 h-2 rounded-full" style="background:${d.color}"></span>
            <span>${d.id} · ${d.name}</span>
          </button>
        `;
      });
      filtersEl.innerHTML = html;

      let counts = { 'Interno': 0, 'Vacante': 0, 'Externo': 0 };
      rolesData.forEach(r => {
        const s = r.status[state.stage];
        if (counts[s] !== undefined) counts[s]++;
      });
      document.getElementById('load-summary').innerHTML = `
        <span><strong class="text-[#4A4643]">Nivel 0:</strong> Gerencia General</span>
        <span><strong>Internos:</strong> ${counts['Interno']}</span>
        ${counts['Vacante'] > 0 ? `<span><strong class="text-[#7D343E]">Por contratar:</strong> ${counts['Vacante']}</span>` : ''}
        <span><strong>Externos:</strong> ${counts['Externo']}</span>
      `;
    }

    function renderLevelZeroBlock() {
      return `
        <div class="mb-6">
          <div onclick="openRoleModal('gerencia-general')" 
               class="role-card cursor-pointer max-w-2xl mx-auto bg-[#EFE9E0] text-[#3E3A37] rounded-xl border border-[#C9B3B6] p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3"
               style="border-top: 4px solid #7D343E;">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-[#7D343E] text-[#FAF8F5]">
                  Nivel 0 · Cúspide Ejecutiva
                </span>
              </div>
              <h2 class="font-serif-title text-lg md:text-xl font-bold text-[#3E3A37]">
                Gerencia General · Socias Fundadoras
              </h2>
              <p class="text-xs text-[#6E6862] mt-0.5">
                Dirección Ejecutiva, Estrategia y Gobernanza Transversal
              </p>
            </div>
            <div class="shrink-0">
              <span class="inline-block px-3 py-1.5 rounded-lg bg-[#FCFBF9] border border-[#D8D0C4] text-[#5C5752] text-xs font-medium">
                Ver ficha →
              </span>
            </div>
          </div>

          <!-- Conector visual suave hacia los 5 departamentos -->
          <div class="flex flex-col items-center">
            <div class="w-0.5 h-4 bg-[#CFC7BC]"></div>
            <div class="w-3/4 max-w-4xl h-0.5 bg-[#CFC7BC] hidden md:block"></div>
          </div>
        </div>
      `;
    }

    function renderRoleCard(role, dept) {
      const currentStatus = role.status[state.stage];
      const sStyle = getStatusStyle(currentStatus);

      return `
        <div onclick="openRoleModal('${role.id}')" 
             class="role-card cursor-pointer bg-[#FCFBF9] rounded-lg border border-[#E2DBD0] p-3.5 flex flex-col justify-between gap-2.5"
             style="border-left: 3.5px solid ${dept.color};">
          <div class="text-[13.5px] font-semibold text-[#3E3A37] leading-snug">
            ${role.title}
          </div>
          <div class="flex items-center justify-between gap-2">
            <span class="inline-block px-2 py-0.5 rounded text-[11px] font-medium ${sStyle.bg} ${sStyle.text}">
              ${sStyle.label}
            </span>
            <span class="text-[11px] text-[#948E87]">Ver ficha →</span>
          </div>
          ${state.showAudit ? `
            <div class="pt-2 border-t border-[#ECE5DA] text-[11px] text-[#7D343E] leading-snug">
              ${role.audit}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderCanvas() {
      const canvas = document.getElementById('org-canvas');
      const visibleDepts = state.activeDept === 'ALL'
        ? DEPARTMENTS
        : DEPARTMENTS.filter(d => d.id === state.activeDept);

      const levelZeroHtml = renderLevelZeroBlock();

      if (state.deviceMode === 'mobile') {
        let html = `<div class="max-w-md mx-auto">${levelZeroHtml}<div class="space-y-5">`;
        visibleDepts.forEach(dept => {
          const deptRoles = rolesData.filter(r => r.dept === dept.id);
          html += `
            <section class="bg-[#EFEAE2]/70 rounded-xl border border-[#E0D9CE] p-3.5">
              <div class="flex items-center gap-2 mb-3 pb-2 border-b border-[#E0D9CE]">
                <span class="w-2.5 h-2.5 rounded-full" style="background:${dept.color}"></span>
                <h2 class="text-xs font-bold uppercase tracking-wider text-[#4A4643]">${dept.id} · ${dept.name}</h2>
              </div>
              <div class="space-y-2.5">
                ${deptRoles.map(r => `
                  <div>
                    <div class="text-[10px] font-medium text-[#8A837C] mb-1">Nivel ${r.level}</div>
                    ${renderRoleCard(r, dept)}
                  </div>
                `).join('')}
              </div>
            </section>
          `;
        });
        html += `</div></div>`;
        canvas.innerHTML = html;
        return;
      }

      const gridCols = visibleDepts.length === 1 ? 'grid-cols-1 max-w-md mx-auto' : 'grid-cols-5';
      let html = `${levelZeroHtml}<div class="overflow-x-auto pb-4"><div class="min-w-[980px]">`;

      // Encabezados de departamento
      html += `<div class="grid ${gridCols} gap-3.5 mb-3">`;
      visibleDepts.forEach(dept => {
        html += `
          <div class="bg-[#FCFBF9] rounded-lg border border-[#E2DBD0] px-3.5 py-2.5 flex items-center gap-2" style="border-top: 3px solid ${dept.color};">
            <span class="text-[11px] font-bold px-1.5 py-0.5 rounded text-white" style="background:${dept.color}">${dept.id}</span>
            <span class="text-xs font-bold text-[#4A4643] truncate">${dept.name}</span>
          </div>
        `;
      });
      html += `</div>`;

      // Filas jerárquicas paralelas (Niveles 1 al 4)
      html += `<div class="space-y-4">`;
      LEVELS.forEach(lvl => {
        html += `
          <div class="bg-[#EFEAE2]/65 rounded-xl border border-[#E2DBD0] p-3.5">
            <div class="text-[11px] font-semibold uppercase tracking-wider text-[#7A746E] mb-2.5 px-1">
              ${lvl.title}
            </div>
            <div class="grid ${gridCols} gap-3.5">
              ${visibleDepts.map(dept => {
                const cellRoles = rolesData.filter(r => r.dept === dept.id && r.level === lvl.id);
                if (cellRoles.length === 0) {
                  return `<div class="rounded-lg border border-dashed border-[#D8D0C4] min-h-[76px] flex items-center justify-center text-[11px] text-[#ADA69E]">—</div>`;
                }
                return `<div class="space-y-2.5">${cellRoles.map(r => renderRoleCard(r, dept)).join('')}</div>`;
              }).join('')}
            </div>
          </div>
        `;
      });
      html += `</div></div></div>`;
      canvas.innerHTML = html;
    }

    function renderModal() {
      const modal = document.getElementById('floating-modal');
      const content = document.getElementById('modal-content');

      if (!state.selectedRoleId) {
        modal.classList.add('hidden');
        return;
      }

      // Caso Nivel 0: Gerencia General
      if (state.selectedRoleId === 'gerencia-general') {
        const exec = EXECUTIVE_ROLE;
        modal.classList.remove('hidden');
        content.innerHTML = `
          <div class="flex items-start justify-between gap-3 pb-3.5 border-b border-[#EAE3D8]">
            <div>
              <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded text-white mb-1.5 bg-[#7D343E]">
                Nivel 0 · Gobierno Corporativo
              </span>
              <h3 class="font-serif-title text-xl font-bold text-[#3E3A37] leading-snug">${exec.title}</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#EFEAE2] hover:bg-[#E4DDD2] text-[#5C5752] flex items-center justify-center text-sm font-bold transition-colors shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-4 space-y-4 text-xs">
            <div>
              <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1">Responsabilidad Ejecutiva</div>
              <p class="text-[#4A4643] text-[13px] leading-relaxed">${exec.mission}</p>
            </div>

            <div class="bg-[#F5EFE6] border border-[#E4DACB] rounded-xl p-3.5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-[#7D343E] mb-1">Criterio Ultra-Lean</div>
              <p class="text-[#5C4B4D] leading-relaxed">${exec.audit}</p>
            </div>

            <div>
              <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1.5">SOPs Clave Supervisados</div>
              <div class="space-y-2">
                ${exec.sops.map(code => `
                  <div class="bg-white border border-[#E6DFD5] rounded-lg p-3">
                    <div class="font-bold text-[#7D343E] mb-0.5">${code}</div>
                    <div class="text-[#635E59] leading-snug">${SOP_DETAILS[code] || ''}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1.5">Indicadores Globales (KPIs)</div>
              <div class="flex flex-wrap gap-1.5">
                ${exec.kpis.map(k => `
                  <span class="px-2.5 py-1 rounded-md bg-[#EFEAE2] text-[#4A4643] font-medium">${k}</span>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      const role = rolesData.find(r => r.id === state.selectedRoleId);
      if (!role) return;

      const dept = DEPARTMENTS.find(d => d.id === role.dept);
      const currentStatus = role.status[state.stage];
      modal.classList.remove('hidden');

      content.innerHTML = `
        <div class="flex items-start justify-between gap-3 pb-3.5 border-b border-[#EAE3D8]">
          <div>
            <span class="inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded text-white mb-1.5" style="background:${dept.color}">
              ${dept.id} · ${dept.name} · Nivel ${role.level}
            </span>
            <h3 class="font-serif-title text-xl font-bold text-[#3E3A37] leading-snug">${role.title}</h3>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#EFEAE2] hover:bg-[#E4DDD2] text-[#5C5752] flex items-center justify-center text-sm font-bold transition-colors shrink-0">
            ✕
          </button>
        </div>

        <div class="mt-4 space-y-4 text-xs">
          <!-- Misión -->
          <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1">Responsabilidad Principal</div>
            <p class="text-[#4A4643] text-[13px] leading-relaxed">${role.mission}</p>
          </div>

          <!-- Criterio Lean / Auditoría -->
          <div class="bg-[#F5EFE6] border border-[#E4DACB] rounded-xl p-3.5">
            <div class="text-[10px] font-bold uppercase tracking-wider text-[#7D343E] mb-1">Criterio Ultra-Lean</div>
            <p class="text-[#5C4B4D] leading-relaxed">${role.audit}</p>
          </div>

          <!-- Modalidad del rol -->
          <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1.5">Modalidad en etapa (${state.stage === 'hoy' ? 'Hoy' : 'Escala'})</div>
            <div class="grid grid-cols-3 gap-2">
              ${['Interno', 'Vacante', 'Externo'].map(opt => `
                <button onclick="changeRoleStatus('${role.id}', '${opt}')"
                  class="py-2 px-2.5 rounded-lg border text-center font-medium transition-all ${currentStatus === opt ? 'bg-[#7D343E] text-white border-[#7D343E]' : 'bg-white text-[#4A4643] border-[#E2DBD0] hover:border-[#7D343E]'}">
                  ${opt === 'Interno' ? 'Equipo Interno' : opt === 'Vacante' ? 'Por contratar' : 'Externo'}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- SOPs Asociados -->
          <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1.5">SOPs Vinculados</div>
            <div class="space-y-2">
              ${role.sops.map(code => `
                <div class="bg-white border border-[#E6DFD5] rounded-lg p-3">
                  <div class="font-bold text-[#7D343E] mb-0.5">${code}</div>
                  <div class="text-[#635E59] leading-snug">${SOP_DETAILS[code] || ''}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- KPIs -->
          <div>
            <div class="text-[10px] font-bold uppercase tracking-wider text-[#8A837C] mb-1.5">Indicadores Clave (KPIs)</div>
            <div class="flex flex-wrap gap-1.5">
              ${role.kpis.map(k => `
                <span class="px-2.5 py-1 rounded-md bg-[#EFEAE2] text-[#4A4643] font-medium">${k}</span>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      renderFiltersAndSummary();
      renderCanvas();
      renderModal();
    }

    renderAll();
  </script>
</body>
</html>

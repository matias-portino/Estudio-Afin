    body {

      background-color: #EFE9E0;
      color: #2E2926;
      -webkit-font-smoothing: antialiased;
    }
    .role-card {
      position: relative;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(46, 41, 38, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }
    .role-card:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 8px 18px -6px rgba(46, 41, 38, 0.12);
      border-color: #9E8279;
    }
    .role-card.is-highlighted {
      border-color: #7D5459 !important;
      box-shadow: 0 6px 16px -4px rgba(125, 84, 89, 0.22);
      background-color: #FFFFFF;
    }
    .role-card.is-dimmed {
      opacity: 0.30;
      filter: grayscale(40%);
    }
    .role-card.is-dimmed:hover {
      opacity: 0.85;
      filter: none;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-animate {
      animation: modalFade 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #E6DDD0; }
    ::-webkit-scrollbar-thumb { background: #C4B8A8; border-radius: 3px; }

    /* MODO PRESENTACIÓN */
    body.presentation-mode {
      background-color: #F4EFE7;
    }
    body.presentation-mode #app-header,
    body.presentation-mode .interactive-arrow {
      display: none !important;
    }
    body.presentation-mode #presentation-header,
    body.presentation-mode #presentation-footer,
    body.presentation-mode #presentation-toolbar {
      display: flex !important;
    }
    body.presentation-mode .role-card:hover {
      transform: none;
    }

    /* ESTILOS DE IMPRESIÓN / EXPORTACIÓN PDF */
    @media print {
      @page {
        size: landscape;
        margin: 10mm 12mm;
      }
      body {
        background-color: #F4EFE7 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        zoom: 0.85;
      }
      #app-header,
      #presentation-toolbar,
      #floating-modal,
      .interactive-arrow {
        display: none !important;
      }
      #presentation-header,
      #presentation-footer {
        display: flex !important;
      }
      main {
        padding-top: 8px !important;
        padding-bottom: 8px !important;
        max-width: 100% !important;
      }
      .level-band {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .role-card {
        box-shadow: none !important;
        transform: none !important;
      }
    }

    function getDeptCapacitySummary(deptId) {
      const deptRoles = rolesData.filter(r => r.dept === deptId);
      const internalRoles = deptRoles.filter(r => r.linkType === 'Interno');
      const externalRoles = deptRoles.filter(r => r.linkType === 'Externo');

      const minInt = internalRoles.reduce((acc, r) => acc + (r.minHeadcount || 0), 0);
      const maxInt = internalRoles.reduce((acc, r) => acc + (r.maxHeadcount || 0), 0);
      const intLabel = minInt === maxInt ? `${minInt} esp.` : `${minInt}–${maxInt} esp.`;

      return externalRoles.length > 0 ? `${intLabel} + ext.` : intLabel;
    }

    function setLinkFilter(filter) {
      state.linkFilter = filter;
      ['ALL', 'Interno', 'Externo'].forEach(f => {
        const btn = document.getElementById(`btn-link-${f}`);
        if (!btn) return;
        btn.className = f === filter
          ? 'px-2.5 py-0.5 rounded-full font-medium transition-all bg-[#7D5459] text-[#FFFFFF]'
          : 'px-2.5 py-0.5 rounded-full font-medium transition-all text-[#635C56] hover:text-[#2E2926]';
      });
      renderAll();
    }

    function togglePresentationMode() {
      state.presentationMode = !state.presentationMode;
      if (state.presentationMode) {
        if (state.deviceMode === 'mobile') {
          setDeviceMode('desktop');
        }
        document.body.classList.add('presentation-mode');
        updatePresentationMeta();
      } else {
        document.body.classList.remove('presentation-mode');
      }
    }

    function updatePresentationMeta() {
      const metaEl = document.getElementById('presentation-meta');
      if (!metaEl) return;
      const filterLabel = state.linkFilter === 'ALL'
        ? 'Estructura Integral · 12–16 Especialistas + Staff + 3 Células'
        : state.linkFilter === 'Interno'
          ? 'Núcleo Interno Estudio Afín SpA'
          : 'Staff y Células Externas';
      const today = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
      metaEl.innerHTML = `
        <div class="font-medium text-[#2E2926]">${filterLabel}</div>
        <div>${today} · ORG-EA V. 2.8</div>
      `;

      } else {
        state.activeSop = sopCode;
        if (state.activeDept !== 'ALL') {
          const deptHasRoles = rolesData.some(r => r.dept === state.activeDept && r.sops.includes(sopCode));
          if (!deptHasRoles) state.activeDept = 'ALL';
        }
      }
      renderAll();
    }

    function handleSearch(val) {
      state.searchQuery = val.trim();
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) {
        if (state.searchQuery.length > 0 || state.activeSop) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
      }
      const upper = state.searchQuery.toUpperCase();
      if (SOP_DETAILS[upper]) {
        state.activeSop = upper;
      } else if (state.searchQuery.length > 0) {
        state.activeSop = null;
      }
      renderAll();
    }

    function clearFilters() {
      state.activeSop = null;
      state.searchQuery = '';
      state.linkFilter = 'ALL';
      setLinkFilter('ALL');
      const input = document.getElementById('quick-search');
      if (input) input.value = '';
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) clearBtn.classList.add('hidden');
      renderAll();
    }

    function closeModal() {
      state.selectedRoleId = null;

      if (modal) modal.classList.add('hidden');

    function handleBackdropClick(e) {
      if (e.target && e.target.id === 'floating-modal') {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.selectedRoleId || state.specialModal) {
          closeModal();
        } else if (state.presentationMode) {
          togglePresentationMode();
        }
      }
    });

    function isRoleMatch(role) {
      if (state.linkFilter !== 'ALL' && role.linkType !== state.linkFilter) {
        return false;
      }
      if (state.activeSop && !role.sops.includes(state.activeSop)) {
        return false;
      }
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        const inTitle = role.title.toLowerCase().includes(q);
        const inMission = role.mission.toLowerCase().includes(q);
        const inBadge = (role.headcountBadge || '').toLowerCase().includes(q);
        const inDeliverables = (role.deliverables || []).some(d => d.toLowerCase().includes(q));
        const inSops = role.sops.some(code => {
          const sopObj = SOP_DETAILS[code];
          return code.toLowerCase().includes(q) || (sopObj && sopObj.title.toLowerCase().includes(q));
        });
        return inTitle || inMission || inBadge || inDeliverables || inSops;
      }
      return true;
    }

    function hasActiveFilter() {
      return Boolean(state.activeSop || state.searchQuery || state.linkFilter !== 'ALL');

    function renderCanvas() {
      const canvas = document.getElementById('org-canvas');
      if (!canvas) return;
      const visibleDepts = state.activeDept === 'ALL'

      const levelZeroBlock = renderLevelZeroHeader();

      if (state.deviceMode === 'mobile') {
        let html = `

              <div class="w-px h-5 bg-[#C4B8A8]"></div>

        `;
        visibleDepts.forEach(dept => {
          const deptRoles = rolesData.filter(r => r.dept === dept.id);
          html += `
            <section class="bg-[#E6DDD0]/75 rounded-2xl border border-[#D8CCB9] p-3 relative">

                ${renderDeptPillarHeader(dept)}

                  <div class="relative">

                    <div class="text-[9.5px] uppercase tracking-widest text-[#756D65] mb-1">Nivel ${r.level}</div>
                    ${renderRoleCard(r, dept)}
                  </div>
                `).join('')}
              </div>
            </section>
          `;
        });
        html += `</div></div>`;
        canvas.innerHTML = html;
        return;
      }

      const isSingle = visibleDepts.length === 1;
      const gridCols = isSingle ? 'grid-cols-1 max-w-md mx-auto' : 'grid-cols-5';

      const topBranchHtml = isSingle
        ? `<div class="flex justify-center"><div class="w-px h-6 bg-[#C4B8A8]"></div></div>`
        : `
          <div class="relative h-7">
            <div class="absolute left-1/2 top-0 w-px h-3.5 -translate-x-1/2 bg-[#C4B8A8]"></div>
            <div class="absolute top-3.5 left-[10%] right-[10%] h-px bg-[#C4B8A8]"></div>
            <div class="grid grid-cols-5 gap-3.5 h-full">
              ${visibleDepts.map(() => `
                <div class="relative h-full">
                  <div class="absolute left-1/2 top-3.5 bottom-0 w-px -translate-x-1/2 bg-[#C4B8A8]"></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

      let html = `
        ${levelZeroBlock}
        <div class="overflow-x-auto pb-4">
          <div class="${isSingle ? 'max-w-md mx-auto' : 'min-w-[1000px]'}">
            
            ${topBranchHtml}

            <!-- Pilares Minimalistas de Departamento -->
            <div class="grid ${gridCols} gap-3.5 relative z-10">
              ${visibleDepts.map(dept => renderDeptPillarHeader(dept)).join('')}
            </div>

            <!-- Ejes verticales y Bandas de Nivel -->
            <div class="relative pt-3">
              <div class="grid ${gridCols} gap-3.5 absolute inset-0 pointer-events-none z-0">
                ${visibleDepts.map(dept => {
                  const deptRoles = rolesData.filter(r => r.dept === dept.id);
                  const maxLvl = deptRoles.length > 0 ? Math.max(...deptRoles.map(r => r.level)) : 1;
                  const lineHeightClass = maxLvl === 4 ? 'bottom-8' : 'bottom-[24%]';
                  return `
                    <div class="relative h-full">
                      <div class="absolute left-1/2 top-0 ${lineHeightClass} w-px -translate-x-1/2 bg-[#C7BCAE]"></div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="space-y-3 relative z-10">
                ${LEVELS.map(lvl => `
                  <div class="level-band bg-[#E6DDD0]/65 rounded-2xl border border-[#D8CCB9] p-3">
                    <div class="flex items-center gap-2 mb-2 px-1">
                      <span class="text-[10px] font-semibold text-[#7D5459]">N${lvl.num}</span>
                      <span class="text-[10px] uppercase tracking-[0.14em] text-[#6E665F] font-medium">${lvl.title}</span>
                    </div>
                    <div class="grid ${gridCols} gap-3.5">
                      ${visibleDepts.map(dept => {
                        const cellRoles = rolesData.filter(r => r.dept === dept.id && r.level === lvl.id);
                        if (cellRoles.length === 0) {
                          return `<div class="min-h-[68px]"></div>`;
                        }
                        return `
                          <div class="space-y-2 relative">
                            ${cellRoles.map(r => `
                              <div class="relative">
                                ${renderRoleCard(r, dept)}
                              </div>
                            `).join('')}
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>

            </div>
          </div>
        </div>
      `;
      canvas.innerHTML = html;
    }

                Nivel 0 · ${exec.headcountBadge}
              </div>
              <h3 class="text-base font-semibold text-[#2E2926]">${exec.title}</h3>
            </div>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full border border-[#D4C7B5] bg-[#FFFFFF] hover:bg-[#EFE9E0] text-[#635C56] flex items-center justify-center text-xs shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-4 space-y-4 text-xs">
            <div class="bg-[#FFFFFF] border border-[#D4C7B5] rounded-xl p-3">
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#7D5459] mb-0.5">Identidad Jurídica</div>
              <div class="font-medium text-[#2E2926]">${exec.legalEntity}</div>
            </div>

            <div class="bg-[#FFFFFF] border border-[#DDD2C2] rounded-xl p-3">
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-0.5">Dotación</div>
              <p class="text-[#3A3430] leading-relaxed">${exec.teamStructure}</p>
            </div>

            <div class="bg-[#EFE9E0] border border-[#D8CCB9] rounded-xl p-3.5">
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#7D5459] mb-0.5">Línea de Fuego Corporativa</div>
              <p class="text-[#453E39] leading-relaxed">${exec.fireLine}</p>
            </div>

            <div>
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1">Responsabilidad Ejecutiva</div>
              <p class="text-[#2E2926] leading-relaxed">${exec.mission}</p>
            </div>

            ${renderAuditAccordion(exec.audit)}
            ${renderDeliverablesAndRisks(exec.deliverables, exec.risksMitigated)}

            <div>
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">SOPs Clave</div>
              <div class="space-y-2">${renderSopListInModal(exec.sops)}</div>
            </div>
          </div>
        `;
        return;
      }

      if (state.selectedRoleId === 'staff-consultor') {
        const staff = STAFF_CONSULTANT_ROLE;
        modal.classList.remove('hidden');
        content.innerHTML = `
          <div class="flex items-start justify-between gap-4 pb-3.5 border-b border-[#E2D8C9]">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#8C785E] mb-0.5">
                Staff Nivel 0 · Asesoría Externa
              </div>
              <h3 class="text-base font-semibold text-[#2E2926]">${staff.title}</h3>
              <div class="mt-1.5">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-[#F2EDE4] text-[#6E5D47] border border-[#DDD3C3]">
                  ${staff.headcountBadge}
                </span>
              </div>
            </div>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full border border-[#D4C7B5] bg-[#FFFFFF] hover:bg-[#EFE9E0] text-[#635C56] flex items-center justify-center text-xs shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-4 space-y-4 text-xs">
            <div class="bg-[#FFFFFF] border border-[#DDD2C2] rounded-xl p-3">
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8C785E] mb-0.5">Vínculo y Alcance</div>
              <p class="text-[#3A3430] leading-relaxed">${staff.teamStructure}</p>
            </div>

            <div>
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1">Responsabilidad Principal</div>
              <p class="text-[#2E2926] leading-relaxed">${staff.mission}</p>
            </div>

            ${renderAuditAccordion(staff.audit)}
            ${renderDeliverablesAndRisks(staff.deliverables, staff.risksMitigated)}

            <div>
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">SOPs Diseñados y Auditados</div>
              <div class="space-y-2">${renderSopListInModal(staff.sops)}</div>
            </div>
          </div>
        `;
        return;
      }

      const role = rolesData.find(r => r.id === state.selectedRoleId);
      if (!role) return;

      const dept = DEPARTMENTS.find(d => d.id === role.dept);
      modal.classList.remove('hidden');

      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 pb-3.5 border-b border-[#E2D8C9]">
          <div>
            <div class="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-[0.15em] mb-0.5" style="color:${dept.color}">
              <span>${dept.id} · ${dept.name}</span>
              <span>·</span>
              <span>Nivel ${role.level}</span>
            </div>
            <h3 class="text-base font-semibold text-[#2E2926]">${role.title}</h3>
            <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-medium border"
                    style="background-color:${dept.tintBg}; color:${dept.color}; border-color:${dept.tintBorder};">
                ${role.headcountBadge}
              </span>
              <span class="px-2.5 py-0.5 rounded-full bg-[#FFFFFF] border border-[#DDD2C2] text-[10px] text-[#635C56]">
                ${role.linkType}
              </span>
            </div>
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-full border border-[#D4C7B5] bg-[#FFFFFF] hover:bg-[#EFE9E0] text-[#635C56] flex items-center justify-center text-xs shrink-0">
            ✕
          </button>
        </div>

        <div class="mt-4 space-y-4 text-xs">
          <div class="bg-[#FFFFFF] border border-[#DDD2C2] rounded-xl p-3">
            <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] mb-0.5" style="color:${dept.color}">
              Dotación y Escalabilidad
            </div>
            <p class="text-[#3A3430] leading-relaxed">${role.teamStructure}</p>
          </div>

          <div>
            <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1">Responsabilidad Principal</div>
            <p class="text-[#2E2926] leading-relaxed">${role.mission}</p>
          </div>

          ${renderAuditAccordion(role.audit)}
          ${renderDeliverablesAndRisks(role.deliverables, role.risksMitigated)}

          <div>
            <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">SOPs Vinculados (${role.sops.length})</div>
            <div class="space-y-2">${renderSopListInModal(role.sops)}</div>
          </div>

          <div>
            <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">Indicadores Clave</div>
            <div class="flex flex-wrap gap-1.5">
              ${role.kpis.map(k => `
                <span class="px-2.5 py-0.5 rounded-full bg-[#FFFFFF] border border-[#D4C7B5] text-[#3A3430] text-[11px]">${k}</span>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      try {
        renderFiltersAndSummary();
        renderCanvas();
        renderModal();
        updatePresentationMeta();
      } catch (err) {
        console.error('Error al renderizar organigrama:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderAll);
    } else {
      renderAll();
    }
  </script>
</body>
</html>

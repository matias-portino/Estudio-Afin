    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F7F3ED;
      color: #2E2926;
      -webkit-font-smoothing: antialiased;
    }
    .role-card {
      position: relative;
      z-index: 10;
      box-shadow: 0 1px 3px rgba(46, 41, 38, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
    }
    .role-card:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 8px 18px -6px rgba(46, 41, 38, 0.08);
      border-color: #9E8E82;
      background-color: #FFFFFF;
    }
    .role-card.is-highlighted {
      border-color: #7D5459 !important;
      box-shadow: 0 6px 16px -4px rgba(125, 84, 89, 0.16);
      background-color: #FFFFFF;
    }
    .role-card.is-origin {
      border-color: #7D5459 !important;
      box-shadow: 0 0 0 2px rgba(125, 84, 89, 0.20), 0 8px 20px -4px rgba(125, 84, 89, 0.18);
      background-color: #FFFFFF;
    }
    .role-card.is-connected {
      border-color: #9E827E !important;
      box-shadow: 0 6px 14px -4px rgba(46, 41, 38, 0.10);
      background-color: #FFFFFF;
    }
    .role-card.is-dimmed {
      opacity: 0.25;
      filter: grayscale(50%);
    }
    .role-card.is-dimmed:hover {
      opacity: 0.85;
      filter: none;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-animate {
      animation: modalFade 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #EFE9E0; }
    ::-webkit-scrollbar-thumb { background: #CFC4B6; border-radius: 3px; }

    /* ESTÁNDAR DE PROPORCIÓN HOJA CARTA HORIZONTAL (11" x 8.5") */
    .letter-canvas-frame {
      max-width: 1120px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    /* MODO PRESENTACIÓN / VISTA PRELIMINAR HOJA CARTA */
    body.presentation-mode {
      background-color: #EDE6DC;
      padding: 20px 16px 64px 16px;
    }
    body.presentation-mode #app-header,
    body.presentation-mode .interactive-arrow,
    body.presentation-mode .network-trigger {
      display: none !important;
    }
    body.presentation-mode #letter-sheet-wrapper {
      background-color: #FAF7F2;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid #DDD2C2;
      box-shadow: 0 18px 42px -12px rgba(46, 41, 38, 0.12);
      padding: 18px 24px 16px 24px;
    }
    body.presentation-mode #presentation-header,
    body.presentation-mode #presentation-footer,
    body.presentation-mode #presentation-toolbar {
      display: flex !important;
    }
    body.presentation-mode main {
      padding-top: 12px !important;
      padding-bottom: 10px !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    body.presentation-mode .role-card:hover {
      transform: none;
    }

    /* ESTILOS DE IMPRESIÓN / EXPORTACIÓN PDF (1 HOJA CARTA EXACTA) */
    @media print {
      @page {
        size: letter landscape;
        margin: 8mm 10mm;
      }
      html, body {
        width: 100%;
        height: auto;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #FAF7F2 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        zoom: 0.80;
      }
      #app-header,
      #presentation-toolbar,
      #floating-modal,
      .interactive-arrow,
      .network-trigger {
        display: none !important;
      }
      #letter-sheet-wrapper {
        background-color: #FAF7F2 !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      #presentation-header,
      #presentation-footer {
        display: flex !important;
        max-width: 100% !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      #presentation-header {
        padding-top: 0 !important;
        padding-bottom: 8px !important;
      }
      #presentation-footer {
        padding-top: 8px !important;
        padding-bottom: 0 !important;
      }
      main {
        padding: 10px 0 8px 0 !important;
        max-width: 100% !important;
      }
      .letter-canvas-frame {
        max-width: 100% !important;
      }
      .org-scroll-container {
        overflow: visible !important;
        padding-bottom: 0 !important;
      }
      .org-min-grid {
        min-width: 0 !important;
        width: 100% !important;
      }
      .level-band {
        break-inside: avoid;
        page-break-inside: avoid;
        padding-top: 6px !important;
        padding-bottom: 2px !important;
      }
      .role-card {
        box-shadow: none !important;
        transform: none !important;
        padding-top: 8px !important;
        padding-bottom: 8px !important;
      }
    }
  </style>
</head>

    let state = {
      linkFilter: 'ALL',
      activeDept: 'ALL',
      searchQuery: '',
      networkFocusRoleId: null,
      selectedRoleId: null,
      activeModalTab: 'rol',
      modalAuditExpanded: false,
      specialModal: null,
      presentationMode: false,
      deviceMode: window.innerWidth < 860 ? 'mobile' : 'desktop'
    };

    function getAllRolesList() {
      return [EXECUTIVE_ROLE, STAFF_CONSULTANT_ROLE, ...rolesData];
    }

    function findRoleById(id) {
      return getAllRolesList().find(r => r.id === id) || null;
    }

    function getDeptCapacitySummary(deptId) {
      const deptRoles = rolesData.filter(r => r.dept === deptId);
      const internalRoles = deptRoles.filter(r => r.linkType === 'Interno');
      const externalRoles = deptRoles.filter(r => r.linkType === 'Externo');

      const minInt = internalRoles.reduce((acc, r) => acc + (r.minHeadcount || 0), 0);
      const maxInt = internalRoles.reduce((acc, r) => acc + (r.maxHeadcount || 0), 0);
      const intLabel = minInt === maxInt ? `${minInt} esp.` : `${minInt}–${maxInt} esp.`;

      return externalRoles.length > 0 ? `${intLabel} + ext.` : intLabel;
    }

    function toggleNetworkFocus(roleId, event) {
      if (event) event.stopPropagation();
      if (state.networkFocusRoleId === roleId) {
        state.networkFocusRoleId = null;
      } else {
        state.networkFocusRoleId = roleId;
        state.activeDept = 'ALL';
      }
      renderAll();
    }

    function focusNetworkFromModal(roleId) {
      closeModal();
      state.networkFocusRoleId = roleId;
      state.activeDept = 'ALL';
      renderAll();
    }

    function clearNetworkFocus() {
      state.networkFocusRoleId = null;
      renderAll();
    }

    function getNetworkRelation(roleId) {
      if (!state.networkFocusRoleId) return null;
      if (roleId === state.networkFocusRoleId) return 'origin';
      const originRole = findRoleById(state.networkFocusRoleId);
      if (!originRole) return null;
      if ((originRole.upstream || []).some(u => u.roleId === roleId)) return 'upstream';
      if ((originRole.downstream || []).some(d => d.roleId === roleId)) return 'downstream';
      return 'unrelated';
    }

    function setLinkFilter(filter) {
      state.linkFilter = filter;
      ['ALL', 'Interno', 'Externo'].forEach(f => {
        const btn = document.getElementById(`btn-link-${f}`);
        if (!btn) return;
        btn.className = f === filter
          ? 'px-2.5 py-0.5 rounded-full font-medium transition-all bg-[#7D5459] text-[#FFFFFF]'
          : 'px-2.5 py-0.5 rounded-full font-medium transition-all text-[#635C56] hover:text-[#2E2926]';
      });
      renderAll();
    }

    function setModalTab(tab) {
      state.activeModalTab = tab;
      renderModal();
    }

    function toggleModalAudit() {
      state.modalAuditExpanded = !state.modalAuditExpanded;
      renderModal();
    }

    function togglePresentationMode() {
      state.presentationMode = !state.presentationMode;
      if (state.presentationMode) {
        if (state.deviceMode === 'mobile') {
          setDeviceMode('desktop');
        }
        state.networkFocusRoleId = null;
        document.body.classList.add('presentation-mode');
        updatePresentationMeta();
        renderAll();
      } else {
        document.body.classList.remove('presentation-mode');
      }
    }

    function updatePresentationMeta() {
      const metaEl = document.getElementById('presentation-meta');
      if (!metaEl) return;
      const filterLabel = state.linkFilter === 'ALL'
        ? 'Estructura Integral · 12–16 Especialistas + Staff + 3 Células'
        : state.linkFilter === 'Interno'
          ? 'Núcleo Interno Estudio Afín SpA'
          : 'Staff y Células Externas';
      const today = new Date().toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });
      metaEl.innerHTML = `
        <div class="font-medium text-[#2E2926]">${filterLabel}</div>
        <div>${today} · ORG-EA V. 3.3 · Carta</div>
      `;
    }

    function setDeviceMode(mode) {
      state.deviceMode = mode;
      const desktopBtn = document.getElementById('btn-view-desktop');
      const mobileBtn = document.getElementById('btn-view-mobile');
      if (desktopBtn) {
        desktopBtn.className = mode === 'desktop'
          ? 'px-2 py-0.5 rounded-full font-medium transition-all bg-[#FFFFFF] text-[#2E2926] shadow-2xs'
          : 'px-2 py-0.5 rounded-full font-medium transition-all text-[#635C56] hover:text-[#2E2926]';
      }
      if (mobileBtn) {
        mobileBtn.className = mode === 'mobile'
          ? 'px-2 py-0.5 rounded-full font-medium transition-all bg-[#FFFFFF] text-[#2E2926] shadow-2xs'
          : 'px-2 py-0.5 rounded-full font-medium transition-all text-[#635C56] hover:text-[#2E2926]';
      }
      renderAll();
    }

    function setDeptFilter(deptId) {
      state.activeDept = deptId;
      renderAll();
    }

    function handleSearch(val) {
      state.searchQuery = val.trim();
      if (state.searchQuery) {
        state.networkFocusRoleId = null;
      }
      renderAll();
    }

    function clearFilters() {
      state.searchQuery = '';
      state.networkFocusRoleId = null;
      state.linkFilter = 'ALL';
      setLinkFilter('ALL');
      const input = document.getElementById('quick-search');
      if (input) input.value = '';
      renderAll();
    }

    function openRoleModal(roleId, initialTab) {
      state.specialModal = null;
      state.selectedRoleId = roleId;
      state.activeModalTab = initialTab || 'rol';
      state.modalAuditExpanded = false;
      renderModal();
    }

    function openSpecialModal(type) {
      state.selectedRoleId = null;
      state.specialModal = type;
      renderModal();
    }

    function closeModal() {
      state.selectedRoleId = null;
      state.specialModal = null;
      const modal = document.getElementById('floating-modal');
      if (modal) modal.classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target && e.target.id === 'floating-modal') {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.selectedRoleId || state.specialModal) {
          closeModal();
        } else if (state.networkFocusRoleId) {
          clearNetworkFocus();
        } else if (state.presentationMode) {
          togglePresentationMode();
        }
      }
    });

    function isRoleMatch(role) {
      if (state.linkFilter !== 'ALL' && role.linkType !== state.linkFilter) {
        return false;
      }
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        const inTitle = role.title.toLowerCase().includes(q);
        const inMission = role.mission.toLowerCase().includes(q);
        const inBadge = (role.headcountBadge || '').toLowerCase().includes(q);
        const inDeliverables = (role.deliverables || []).some(d => d.toLowerCase().includes(q));
        return inTitle || inMission || inBadge || inDeliverables;
      }
      return true;
    }

    function hasActiveFilter() {
      return Boolean(state.searchQuery || state.linkFilter !== 'ALL');
    }

    function getCardVisualState(role) {
      if (state.networkFocusRoleId) {
        const rel = getNetworkRelation(role.id);
        if (rel === 'origin') return { stateClass: 'is-origin', relationTag: 'Nodo activo' };
        if (rel === 'upstream') return { stateClass: 'is-connected', relationTag: '← Entrega insumo' };
        if (rel === 'downstream') return { stateClass: 'is-connected', relationTag: '→ Recibe entrega' };
        return { stateClass: 'is-dimmed', relationTag: null };
      }
      if (hasActiveFilter()) {
        return {
          stateClass: isRoleMatch(role) ? 'is-highlighted' : 'is-dimmed',
          relationTag: null
        };
      }
      return { stateClass: '', relationTag: null };
    }

              `).join('')}
            </div>
          </div>
        `;

      let html = `
        ${levelZeroBlock}
        <div class="org-scroll-container overflow-x-auto pb-2">
          <div class="${isSingle ? 'max-w-md mx-auto' : 'org-min-grid min-w-[940px]'}">
            
            ${topBranchHtml}

            <!-- Pilares Minimalistas de Departamento -->
            <div class="grid ${gridCols} gap-3.5 relative z-10">
              ${visibleDepts.map(dept => renderDeptPillarHeader(dept)).join('')}
            </div>

            <!-- Ejes verticales y Bandas Ultraligeras de Nivel -->
            <div class="relative pt-2.5">
              <div class="grid ${gridCols} gap-3.5 absolute inset-0 pointer-events-none z-0">
                ${visibleDepts.map(dept => {
                  const deptRoles = rolesData.filter(r => r.dept === dept.id);
                  const maxLvl = deptRoles.length > 0 ? Math.max(...deptRoles.map(r => r.level)) : 1;
                  const lineHeightClass = maxLvl === 4 ? 'bottom-7' : 'bottom-[24%]';
                  return `
                    <div class="relative h-full">
                      <div class="absolute left-1/2 top-0 ${lineHeightClass} w-px -translate-x-1/2 bg-[#D6CCC0]"></div>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="space-y-2.5 relative z-10">
                ${LEVELS.map(lvl => `
                  <div class="level-band pt-2 pb-0.5 border-t border-[#E2D8C9]">
                    <div class="flex items-center gap-2 mb-1.5 px-0.5">
                      <span class="text-[9px] font-semibold text-[#7D5459]">${lvl.num}</span>
                      <span class="text-[9px] uppercase tracking-[0.16em] text-[#7D756D]">${lvl.title}</span>
                    </div>
                    <div class="grid ${gridCols} gap-3.5">
                      ${visibleDepts.map(dept => {
                        const cellRoles = rolesData.filter(r => r.dept === dept.id && r.level === lvl.id);
                        if (cellRoles.length === 0) {
                          return `<div class="min-h-[54px]"></div>`;
                        }
                        return `
                          <div class="space-y-1.5 relative">
                            ${cellRoles.map(r => `
                              <div class="relative">
                                ${renderRoleCard(r, dept)}
                              </div>
                            `).join('')}
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>

            </div>
          </div>
        </div>
      `;
      canvas.innerHTML = html;
    }

    function renderAuditAccordion(auditText) {
      const isOpen = state.modalAuditExpanded;
      return `
        <div class="rounded-xl border ${isOpen ? 'border-[#7D5459]/35 bg-[#F5EFE6]' : 'border-[#E2D8C9] bg-[#FFFFFF]'} overflow-hidden transition-all">
          <button
            type="button"
            onclick="toggleModalAudit()"
            class="w-full px-4 py-2.5 flex items-center justify-between gap-3 text-left hover:bg-[#F7F3ED] transition-colors"
          >
            <span class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#7D5459]">
              Criterio de Diseño Organizacional
            </span>
            <span class="text-[10.5px] font-medium text-[#7D5459] flex items-center gap-1 shrink-0">
              <span>${isOpen ? 'Ocultar' : 'Ver fundamento'}</span>
              <span class="transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}">▾</span>
            </span>
          </button>
          ${isOpen ? `
            <div class="px-4 pb-3 pt-1 border-t border-[#E6DDD0] text-[#453E39] leading-relaxed">
              ${auditText}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSopListInModal(sops) {
      return sops.map(code => {
        const sop = SOP_DETAILS[code];
        if (!sop) return '';
        return `
          <div class="bg-[#FFFFFF] border border-[#E2D8C9] rounded-xl p-3">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="font-medium text-[#7D5459]">
                ${code} · ${sop.title}
              </div>
              <span class="text-[9.5px] px-1.5 py-0.5 rounded bg-[#F5EFE6] text-[#6E665F] shrink-0">
                ${sop.version}
              </span>
            </div>
            <div class="text-[#635C56] leading-relaxed">${sop.desc}</div>
          </div>
        `;
      }).join('');
    }

    function renderModalTabsBar(role) {
      const tabs = [
        { id: 'rol', label: 'Rol & Dotación' },
        { id: 'entregables', label: 'Entregables & Control' },
        { id: 'red', label: 'Red & SOPs' }
      ];
      return `
        <div class="mt-3.5 border-b border-[#E6DDD0] flex items-center gap-1">
          ${tabs.map(t => {
            const active = state.activeModalTab === t.id;
            return `
              <button
                type="button"
                onclick="setModalTab('${t.id}')"
                class="px-3 py-2 text-[11px] font-medium border-b-2 transition-all ${
                  active
                    ? 'border-[#7D5459] text-[#7D5459]'
                    : 'border-transparent text-[#756D65] hover:text-[#2E2926]'
                }"
              >
                ${t.label}
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderNetworkTabContent(role) {
      const upstream = role.upstream || [];
      const downstream = role.downstream || [];

      const renderConnectionCards = (items) => {
        if (items.length === 0) {
          return `<div class="text-[11px] text-[#8A8178] italic px-1">Sin dependencias directas en esta dirección.</div>`;
        }
        return `
          <div class="space-y-1.5">
            ${items.map(item => {
              const targetRole = findRoleById(item.roleId);
              if (!targetRole) return '';
              const deptObj = DEPARTMENTS.find(d => d.id === targetRole.dept);
              const areaLabel = deptObj ? deptObj.id : (targetRole.dept || 'DIR');
              return `
                <div
                  onclick="openRoleModal('${targetRole.id}', 'rol')"
                  class="cursor-pointer group bg-[#FFFFFF] border border-[#E2D8C9] hover:border-[#7D5459] rounded-xl p-2.5 flex items-center justify-between gap-3 transition-all"
                >
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="text-[9px] font-semibold uppercase tracking-wider px-1.5 py-0.2 rounded bg-[#F5EFE6] text-[#6E665F]">${areaLabel}</span>
                      <span class="font-medium text-[#2E2926] group-hover:text-[#7D5459] transition-colors">${targetRole.title}</span>
                    </div>
                    <div class="text-[#635C56] text-[11px] mt-0.5 leading-snug">${item.note}</div>
                  </div>
                  <span class="text-[#A3998E] group-hover:text-[#7D5459] text-xs shrink-0">↗</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      };

      return `
        <div class="space-y-4">
          <div class="bg-[#F5EFE6]/90 border border-[#E2D8C9] rounded-xl p-3 flex flex-wrap items-center justify-between gap-2">
            <span class="text-[11px] text-[#4F4842]">
              Visualiza estas conexiones directamente sobre el organigrama.
            </span>
            <button
              type="button"
              onclick="focusNetworkFromModal('${role.id}')"
              class="px-3 py-1 rounded-full bg-[#7D5459] hover:bg-[#8E6268] text-[#FFFFFF] text-[10.5px] font-medium transition-colors shrink-0"
            >
              ⇄ Iluminar en el mapa
            </button>
          </div>

          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">
              ← Recibe insumos de (${upstream.length})
            </div>
            ${renderConnectionCards(upstream)}
          </div>

          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">
              → Entrega resultados a (${downstream.length})
            </div>
            ${renderConnectionCards(downstream)}
          </div>

          <div class="pt-1 border-t border-[#E6DDD0]">
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">
              SOPs Referenciados (${(role.sops || []).length})
            </div>
            <div class="space-y-2">${renderSopListInModal(role.sops || [])}</div>
          </div>
        </div>
      `;
    }

    function renderDeliverablesTabContent(role) {
      const deliverables = role.deliverables || [];
      const risks = role.risksMitigated || [];
      const kpis = role.kpis || [];

      return `
        <div class="space-y-4">
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">Entregables y Control</div>
            <ul class="space-y-1.5 bg-[#FFFFFF] border border-[#E2D8C9] rounded-xl p-3.5 text-[#3A3430]">
              ${deliverables.map(item => `
                <li class="flex items-start gap-2 leading-relaxed">
                  <span class="text-[#7D5459] mt-0.5">•</span>
                  <span>${item}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          ${risks.length > 0 ? `
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">Riesgos Mitigados</div>
              <div class="space-y-1.5">
                ${risks.map(risk => `
                  <div class="bg-[#F6F1E9] border border-[#E5DDD0] rounded-lg px-3 py-2 text-[#4F4842] flex items-start gap-2 leading-relaxed">
                    <span class="text-[#7D5459] shrink-0">▪</span>
                    <span>${risk}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${kpis.length > 0 ? `
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1.5">Indicadores Clave (KPIs)</div>
              <div class="flex flex-wrap gap-1.5">
                ${kpis.map(k => `
                  <span class="px-2.5 py-1 rounded-full bg-[#FFFFFF] border border-[#DDD2C2] text-[#3A3430] text-[11px] font-medium">${k}</span>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderSpecialModals() {
      const modal = document.getElementById('floating-modal');
      const content = document.getElementById('modal-content');
      if (!modal || !content) return;
      modal.classList.remove('hidden');

      if (state.specialModal === 'kpis') {
        content.innerHTML = `
          <div class="flex items-start justify-between gap-4 pb-3.5 border-b border-[#E6DDD0]">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#7D5459] mb-0.5">
                Documento Maestro V. 2.6
              </div>
              <h3 class="text-base font-semibold text-[#2E2926]">KPIs Estratégicos y Operativos</h3>
            </div>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full border border-[#DDD2C2] bg-[#FFFFFF] hover:bg-[#F5EFE6] text-[#635C56] flex items-center justify-center text-xs shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-4 space-y-4 text-xs">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#7D5459] mb-2">
                1. KPIs Externos (Experiencia del Propietario)
              </div>
              <div class="space-y-2">
                ${MASTER_KPIS.external.map(k => `
                  <div class="bg-[#FFFFFF] border border-[#E2D8C9] rounded-xl p-3 flex items-start justify-between gap-3">
                    <div>
                      <div class="font-medium text-[#2E2926]">${k.name}</div>
                      <div class="text-[#635C56] mt-0.5 leading-relaxed">${k.desc}</div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-[#F7F0EE] text-[#7D5459] font-medium text-[10px] shrink-0">
                      ${k.target}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#6E665F] mb-2">
                2. KPIs Internos (Eficiencia Operativa)
              </div>
              <div class="space-y-2">
                ${MASTER_KPIS.internal.map(k => `
                  <div class="bg-[#F6F1E9] border border-[#E2D8C9] rounded-xl p-3 flex items-start justify-between gap-3">
                    <div>
                      <div class="font-medium text-[#2E2926]">${k.name}</div>
                      <div class="text-[#635C56] mt-0.5 leading-relaxed">${k.desc}</div>
                    </div>
                    <span class="px-2 py-0.5 rounded-full bg-[#FFFFFF] border border-[#DDD2C2] text-[#453E39] font-medium text-[10px] shrink-0">
                      ${k.target}
                    </span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (state.specialModal === 'versions') {
        content.innerHTML = `
          <div class="flex items-start justify-between gap-4 pb-3.5 border-b border-[#E6DDD0]">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#7D5459] mb-0.5">
                Versionado Semántico (X.Y)
              </div>
              <h3 class="text-base font-semibold text-[#2E2926]">Control de Versiones · ORG-EA V. 3.3</h3>
            </div>
            <button onclick="closeModal()" class="w-7 h-7 rounded-full border border-[#DDD2C2] bg-[#FFFFFF] hover:bg-[#F5EFE6] text-[#635C56] flex items-center justify-center text-xs shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-4 space-y-3.5 text-xs">
            <p class="text-[#635C56] leading-relaxed">
              Sincronizado con <strong class="text-[#2E2926]">DOC-MAESTRO V. 2.6</strong> de ESTUDIO AFÍN SpA.
            </p>
            <div class="border border-[#E2D8C9] rounded-xl overflow-hidden bg-[#FFFFFF]">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-[#F2ECE3] text-[10px] uppercase tracking-wider text-[#635C56] border-b border-[#E2D8C9]">
                    <th class="py-2 px-3 font-semibold">Versión</th>
                    <th class="py-2 px-3 font-semibold">Fecha</th>
                    <th class="py-2 px-3 font-semibold">Cambio</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#F0E9DF]">
                  ${VERSION_HISTORY.map(v => `
                    <tr class="${v.ver === '3.3' ? 'bg-[#FAF5F3]' : ''}">
                      <td class="py-2 px-3 font-medium text-[#7D5459] whitespace-nowrap">V. ${v.ver}</td>
                      <td class="py-2 px-3 text-[#756D65] whitespace-nowrap">${v.date}</td>
                      <td class="py-2 px-3 text-[#3A3430] leading-relaxed">${v.desc}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    function renderModal() {
      const modal = document.getElementById('floating-modal');
      const content = document.getElementById('modal-content');
      if (!modal || !content) return;

      if (state.specialModal) {
        renderSpecialModals();
        return;
      }

      if (!state.selectedRoleId) {
        modal.classList.add('hidden');
        return;
      }

      const role = findRoleById(state.selectedRoleId);
      if (!role) return;

      modal.classList.remove('hidden');

      let headerSub = '';
      let badgeHtml = '';

      if (role.id === 'gerencia-general') {
        headerSub = `Nivel 0 · ${role.headcountBadge}`;
      } else if (role.id === 'staff-consultor') {
        headerSub = `Staff Nivel 0 · Asesoría Externa`;
        badgeHtml = `
          <div class="mt-1.5">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-medium bg-[#F6F1E7] text-[#6E6352] border border-[#E8E0D1]">
              ${role.headcountBadge}
            </span>
          </div>
        `;
      } else {
        const dept = DEPARTMENTS.find(d => d.id === role.dept);
        headerSub = `${dept.id} · ${dept.name} · Nivel ${role.level}`;
        badgeHtml = `
          <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-medium border text-[#4A433E]"
                  style="background-color:${dept.tintBg}; border-color:${dept.tintBorder};">
              ${role.headcountBadge}
            </span>
            <span class="px-2.5 py-0.5 rounded-full bg-[#FFFFFF] border border-[#E2D8C9] text-[10px] text-[#635C56]">
              ${role.linkType}
            </span>
          </div>
        `;
      }

      let tabBodyHtml = '';
      if (state.activeModalTab === 'rol') {
        tabBodyHtml = `
          <div class="space-y-4">
            ${role.legalEntity ? `
              <div class="bg-[#FFFFFF] border border-[#DDD2C2] rounded-xl p-3">
                <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#7D5459] mb-0.5">Identidad Jurídica</div>
                <div class="font-medium text-[#2E2926]">${role.legalEntity}</div>
              </div>
            ` : ''}

            <div>
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#8A8178] mb-1">Responsabilidad Principal</div>
              <p class="text-[#2E2926] leading-relaxed">${role.mission}</p>
            </div>

            <div class="bg-[#FFFFFF] border border-[#E2D8C9] rounded-xl p-3">
              <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#7D5459] mb-0.5">
                Dotación y Escalabilidad
              </div>
              <p class="text-[#3A3430] leading-relaxed">${role.teamStructure}</p>
            </div>

            ${role.fireLine ? `
              <div class="bg-[#F6F1E9] border border-[#E2D8C9] rounded-xl p-3.5">
                <div class="text-[9.5px] font-semibold uppercase tracking-[0.14em] text-[#7D5459] mb-0.5">Línea de Fuego Corporativa</div>
                <p class="text-[#453E39] leading-relaxed">${role.fireLine}</p>
              </div>
            ` : ''}

            ${renderAuditAccordion(role.audit)}
          </div>
        `;
      } else if (state.activeModalTab === 'entregables') {
        tabBodyHtml = renderDeliverablesTabContent(role);
      } else if (state.activeModalTab === 'red') {
        tabBodyHtml = renderNetworkTabContent(role);
      }

      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 pb-3 border-b border-[#E6DDD0]">
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.15em] mb-0.5 text-[#756D65]">
              ${headerSub}
            </div>
            <h3 class="text-base font-semibold text-[#2E2926]">${role.title}</h3>
            ${badgeHtml}
          </div>
          <button onclick="closeModal()" class="w-7 h-7 rounded-full border border-[#DDD2C2] bg-[#FFFFFF] hover:bg-[#F5EFE6] text-[#635C56] flex items-center justify-center text-xs shrink-0">
            ✕
          </button>
        </div>

        ${renderModalTabsBar(role)}

        <div class="mt-4 text-xs">
          ${tabBodyHtml}
        </div>
      `;
    }

    function renderAll() {
      try {
        renderFiltersAndSummary();
        renderCanvas();
        renderModal();
        updatePresentationMeta();
      } catch (err) {
        console.error('Error al renderizar organigrama:', err);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderAll);
    } else {
      renderAll();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigrama Estudio Afín SpA | Estructura y Roles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #EFE9E0;
      color: #2E2926;
      -webkit-font-smoothing: antialiased;
    }
    .role-card {
      position: relative;
      z-index: 10;
      box-shadow: 0 1px 3px rgba(46, 41, 38, 0.035);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, background-color 0.2s ease;
    }
    .role-card:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 8px 18px -6px rgba(46, 41, 38, 0.10);
      border-color: #9E8E82;
      background-color: #FFFFFF;
    }
    .role-card.is-highlighted {
      border-color: #7D5459 !important;
      box-shadow: 0 6px 16px -4px rgba(125, 84, 89, 0.18);
      background-color: #FFFFFF;
    }
    .role-card.is-origin {
      border-color: #7D5459 !important;
      box-shadow: 0 0 0 2px rgba(125, 84, 89, 0.22), 0 8px 20px -4px rgba(125, 84, 89, 0.22);
      background-color: #FFFFFF;
    }
    .role-card.is-connected {
      border-color: #9E827E !important;
      box-shadow: 0 6px 14px -4px rgba(46, 41, 38, 0.12);
      background-color: #FFFFFF;
    }
    .role-card.is-dimmed {
      opacity: 0.25;
      filter: grayscale(50%);
    }
    .role-card.is-dimmed:hover {
      opacity: 0.85;
      filter: none;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-animate {
      animation: modalFade 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #E6DDD0; }
    ::-webkit-scrollbar-thumb { background: #C4B8A8; border-radius: 3px; }

    /* ESTÁNDAR DE PROPORCIÓN HOJA CARTA HORIZONTAL (11" x 8.5") */
    .letter-canvas-frame {
      max-width: 1120px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    /* MODO PRESENTACIÓN / VISTA PRELIMINAR HOJA CARTA */
    body.presentation-mode {
      background-color: #E3D9CA;
      padding: 20px 16px 64px 16px;
    }
    body.presentation-mode #app-header,
    body.presentation-mode .interactive-arrow,
    body.presentation-mode .network-trigger {
      display: none !important;
    }
    body.presentation-mode #letter-sheet-wrapper {
      background-color: #F6F1E9;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid #D1C4B2;
      box-shadow: 0 18px 42px -12px rgba(46, 41, 38, 0.16);
      padding: 18px 24px 16px 24px;
    }
    body.presentation-mode #presentation-header,
    body.presentation-mode #presentation-footer,
    body.presentation-mode #presentation-toolbar {
      display: flex !important;
    }
    body.presentation-mode main {
      padding-top: 12px !important;
      padding-bottom: 10px !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    body.presentation-mode .role-card:hover {
      transform: none;
    }

    /* ESTILOS DE IMPRESIÓN / EXPORTACIÓN PDF (1 HOJA CARTA EXACTA) */
    @media print {
      @page {
        size: letter landscape;
        margin: 8mm 10mm;
      }
      html, body {
        width: 100%;
        height: auto;
        margin: 0 !important;
        padding: 0 !important;
        background-color: #F6F1E9 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        zoom: 0.80;
      }
      #app-header,
      #presentation-toolbar,
      #floating-modal,
      .interactive-arrow,
      .network-trigger {
        display: none !important;
      }
      #letter-sheet-wrapper {
        background-color: #F6F1E9 !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      #presentation-header,
      #presentation-footer {
        display: flex !important;
        max-width: 100% !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      #presentation-header {
        padding-top: 0 !important;
        padding-bottom: 8px !important;
      }
      #presentation-footer {
        padding-top: 8px !important;
        padding-bottom: 0 !important;
      }
      main {
        padding: 10px 0 8px 0 !important;
        max-width: 100% !important;
      }
      .letter-canvas-frame {
        max-width: 100% !important;
      }
      .org-scroll-container {
        overflow: visible !important;
        padding-bottom: 0 !important;
      }
      .org-min-grid {
        min-width: 0 !important;
        width: 100% !important;
      }
      .level-band {
        break-inside: avoid;
        page-break-inside: avoid;
        padding-top: 6px !important;
        padding-bottom: 2px !important;
      }
      .role-card {
        box-shadow: none !important;
        transform: none !important;
        padding-top: 8px !important;
        padding-bottom: 8px !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#7D5459]/15 selection:text-[#7D5459]">

  <!-- BARRA FLOTANTE DE MODO PRESENTACIÓN / CARTA -->
  <div id="presentation-toolbar" class="hidden fixed bottom-5 right-6 z-40 items-center gap-2 bg-[#2E2926

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigrama Estudio Afín | Roles y Estructura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F8F5F0;
      color: #4A4541;
      -webkit-font-smoothing: antialiased;
    }
    .font-editorial {
      font-family: 'Cormorant Garamond', serif;
    }
    .role-card {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .role-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -10px rgba(74, 69, 65, 0.12);
      border-color: #B89B9E;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-animate {
      animation: modalFade 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #F2EDE4; }
    ::-webkit-scrollbar-thumb { background: #D4CBC0; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#7A353E]/15 selection:text-[#7A353E]">

  <!-- CABECERA EDITORIAL -->
  <header class="bg-[#F8F5F0]/95 backdrop-blur-md border-b border-[#E5DDD2] sticky top-0 z-30">
    <div class="max-w-[1400px] mx-auto px-5 md:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Identidad y Título -->
      <div class="flex items-baseline gap-3">
        <h1 class="font-editorial text-2xl md:text-[26px] font-semibold tracking-tight text-[#3A3532]">
          Organigrama Estudio Afín
        </h1>
        <span class="hidden sm:inline-block text-[#A39A90] font-light">|</span>
        <span class="font-editorial italic text-base md:text-lg text-[#7A353E]">
          Roles y Estructura
        </span>
      </div>

      <!-- Controles Refinados -->
      <div class="flex flex-wrap items-center gap-2.5">
        <!-- Etapa: Hoy vs Escala -->
        <div class="bg-[#EFE9E0] p-0.5 rounded-full border border-[#E2D9CC] flex items-center text-[11px] tracking-wide">
          <button onclick="setStage('hoy')" id="btn-stage-hoy" class="px-3.5 py-1 rounded-full font-medium transition-all bg-[#7A353E] text-[#FDFBF7] shadow-xs">
            Hoy
          </button>
          <button onclick="setStage('escala')" id="btn-stage-escala" class="px-3.5 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]">
            Escala
          </button>
        </div>

        <!-- Auditoría -->
        <button onclick="toggleAudit()" id="btn-audit" class="px-3 py-1.5 rounded-full border border-[#DED5C8] bg-[#FDFBF7] text-[#6E6862] hover:border-[#7A353E]/40 hover:text-[#3A3532] text-[11px] tracking-wide font-medium transition-all">
          Auditoría: OFF
        </button>

        <!-- Vista PC / Móvil -->
        <div class="bg-[#EFE9E0] p-0.5 rounded-full border border-[#E2D9CC] flex items-center text-[11px] tracking-wide">
          <button onclick="setDeviceMode('desktop')" id="btn-view-desktop" class="px-3 py-1 rounded-full font-medium transition-all bg-[#FDFBF7] text-[#3A3532] shadow-xs">
            PC
          </button>
          <button onclick="setDeviceMode('mobile')" id="btn-view-mobile" class="px-3 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]">
            Móvil
          </button>
        </div>
      </div>
    </div>

    <!-- Sub-barra de navegación por áreas -->
    <div class="bg-[#F3EFE8]/80 border-t border-[#EAE2D6] px-5 md:px-8 py-2.5">
      <div class="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-3 text-[11.5px]">
        <div id="dept-filters" class="flex items-center gap-1.5 overflow-x-auto pb-0.5 md:pb-0">
          <!-- Render dinámico -->
        </div>
        <div id="load-summary" class="flex items-center gap-4 text-[11px] text-[#857E77] tracking-wide">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>
  </header>

  <!-- LIENZO PRINCIPAL -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto px-5 md:px-8 py-8">
    <div id="org-canvas" class="w-full">
      <!-- Renderizado dinámico -->
    </div>
  </main>

  <!-- MODAL FLOTANTE ESTILO FICHA DE CATÁLOGO -->
  <div id="floating-modal" onclick="handleBackdropClick(event)" class="hidden fixed inset-0 z-50 bg-[#4A4541]/25 backdrop-blur-[3px] flex items-center justify-center p-4">
    <div class="modal-animate w-full max-w-lg max-h-[88vh] overflow-y-auto bg-[#FDFBF7] rounded-2xl border border-[#E2D9CC] shadow-[0_24px_48px_-12px_rgba(58,53,50,0.18)] p-6 md:p-8">
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const DEPARTMENTS = [
      { id: 'COM', name: 'Comercial & Cliente', color: '#7A353E' },
      { id: 'DIS', name: 'Diseño Estratégico', color: '#A35E66' },
      { id: 'LOG', name: 'Operaciones & Logística', color: '#78736E' },
      { id: 'TER', name: 'Montaje & Terreno', color: '#968C82' },
      { id: 'FIN', name: 'Admin & Finanzas', color: '#B59E84' }
    ];

    const LEVELS = [
      { id: 1, num: 'I', title: 'Dirección de Área' },
      { id: 2, num: 'II', title: 'Liderazgo Operativo' },
      { id: 3, num: 'III', title: 'Ejecución y Apoyo' },
      { id: 4, num: 'IV', title: 'Aliados Externos' }
    ];

    const SOP_DETAILS = {
      'COM-01': 'Filtro de calificación (CAPEX, plazos y exclusión de anti-clientes) y firma de contrato.',
      'COM-02': 'Correo como único canal vinculante, SLAs de respuesta y órdenes de cambio pagadas por adelantado.',
      'COM-03': 'Inspección final, entrega de dossier a Property Manager, Welcome Book y cobro del 20% final.',
      'DIS-01': 'Levantamiento, Moodboard de conversión (máx. 2 revisiones) y matriz de compras FF&E Open Book.',
      'LOG-01': 'Órdenes de compra tras Hito 2 (30%), acopio transitorio y control de calidad antes de firmar guía.',
      'LOG-02': 'Control excepcional de mueblistas externos homologados: muestras físicas y tolerancia +/- 2 mm.',
      'TER-01': 'Permisos en conserjería 48h antes, protección de ascensores y retiro total de embalajes el mismo día.',
      'TER-02': 'Aseo profundo, montaje escénico (Styling) y pauta fotográfica estándar para Airbnb/Booking.',
      'FIN-01': 'Calendario inamovible 50%-30%-20%, regla de cero financiamiento propio y rendición Open Book.'
    };

    const EXECUTIVE_ROLE = {
      id: 'gerencia-general',
      dept: 'DIR',
      deptName: 'Gobierno Corporativo',
      color: '#7A353E',
      level: 0,
      title: 'Gerencia General · Socias Fundadoras',
      mission: 'Liderar la estrategia global de Estudio Afín, aprobar alianzas clave, custodiar la cultura corporativa y dirigir transversalmente las 5 áreas de la firma.',
      audit: 'Estructura bicéfala ejecutiva en la cúspide (Nivel 0). En etapa inicial, la Gerencia General lidera las direcciones clave antes de delegar mandos medios.',
      sops: ['COM-01', 'DIS-01', 'FIN-01'],
      kpis: ['7 proyectos/año', 'CSAT > 85%', 'NPS 9–10']
    };

    let rolesData = [
      // NIVEL 1
      {
        id: 'com-dir', dept: 'COM', level: 1,
        title: 'Dirección Comercial & Cuentas',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Liderar alianzas B2B con Property Managers, filtrar inversionistas y cerrar contratos.',
        audit: 'Fusión total de prospección, cuentas y cierre comercial en un solo liderazgo.',
        sops: ['COM-01', 'COM-02'],
        kpis: ['7 proyectos/año', 'NPS 9–10']
      },
      {
        id: 'dis-dir', dept: 'DIS', level: 1,
        title: 'Dirección Creativa & FF&E',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Definir el concepto visual adaptado al entorno y aprobar el presupuesto FF&E.',
        audit: 'Elimina renders 3D lentos; prioriza Moodboards ágiles orientados a conversión.',
        sops: ['DIS-01'],
        kpis: ['Máx. 2 rondas revisión', 'Lead Time diseño']
      },
      {
        id: 'log-dir', dept: 'LOG', level: 1,
        title: 'Dirección de Operaciones',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Controlar cadena de abastecimiento, negociar con proveedores y velar por plazos.',
        audit: 'Absorbe dirección de compras y control de proveedores bajo una sola cabeza.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Cumplimiento proveedores', 'Cero quiebres']
      },
      {
        id: 'ter-dir', dept: 'TER', level: 1,
        title: 'Dirección de Montaje',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Asegurar ejecución llave en mano sin fricciones en edificios y entrega conforme.',
        audit: 'Unificada junto a Operaciones para evitar brechas entre compra y obra.',
        sops: ['TER-01', 'COM-03'],
        kpis: ['CSAT > 85%', 'Entrega en fecha']
      },
      {
        id: 'fin-dir', dept: 'FIN', level: 1,
        title: 'Dirección Financiera & Control',
        status: { hoy: 'Interno', escala: 'Interno' },
        mission: 'Custodiar flujo de caja por hitos (50-30-20), aprobar pagos y validar rentabilidad.',
        audit: 'Regla estricta de cero financiamiento propio del mobiliario.',
        sops: ['FIN-01'],
        kpis: ['Variación CAPEX ~ 0%', 'Margen markup']
      },

      // NIVEL 2
      {
        id: 'com-lead', dept: 'COM', level: 2,
        title: 'Ejecutivo Comercial & Handover',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Gestionar comunicaciones oficiales, órdenes de cambio y entrega de llaves.',
        audit: 'Fusiona Onboarding + Gestión de Cambios + Handover en una sola persona.',
        sops: ['COM-01', 'COM-02', 'COM-03'],
        kpis: ['SLA respuesta < 8h', 'CSAT Handover']
      },
      {
        id: 'dis-lead', dept: 'DIS', level: 2,
        title: 'Diseñador/a FF&E Senior',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Ejecutar levantamiento en terreno, armar Moodboards y cerrar matriz de compra.',
        audit: 'Absorbe interiorismo + especificación técnica en un perfil integral.',
        sops: ['DIS-01'],
        kpis: ['85–90% compra retail', 'Precisión medidas']
      },
      {
        id: 'log-lead', dept: 'LOG', level: 2,
        title: 'Líder de Procura & Acopio',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Emitir órdenes de compra, recibir despachos con checklist y coordinar bodega.',
        audit: 'Contratación prioritaria #1 en crecimiento para liberar carga operativa.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Rechazo en 24h', '0 mermas en bodega']
      },
      {
        id: 'ter-lead', dept: 'TER', level: 2,
        title: 'Supervisor/a de Obra & Styling',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Coordinar permisos en conserjería, supervisar maestros y dirigir styling final.',
        audit: 'Fusiona supervisión técnica en obra + dirección de arte fotográfica.',
        sops: ['TER-01', 'TER-02'],
        kpis: ['Obra limpia 100%', '0 multas edificio']
      },
      {
        id: 'fin-lead', dept: 'FIN', level: 2,
        title: 'Control de Gestión & Open Book',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Emitir facturas por hitos, rendir boletas Open Book y controlar márgenes.',
        audit: 'Se mantiene interno hasta escala; contabilidad tributaria va 100% externa.',
        sops: ['FIN-01'],
        kpis: ['Cobro 100% pre-compra', 'Cierre Open Book']
      },

      // NIVEL 3
      {
        id: 'dis-exec', dept: 'DIS', level: 3,
        title: 'Asistente Diseño & Cotizaciones',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Armar láminas de Moodboard, verificar stock en tiendas y actualizar planillas.',
        audit: 'Contratación de apoyo en crecimiento para liberar horas operativas de diseño.',
        sops: ['DIS-01'],
        kpis: ['Stock validado 100%', 'Cotización < 48h']
      },
      {
        id: 'ter-exec', dept: 'TER', level: 3,
        title: 'Coordinador Logística & Montaje',
        status: { hoy: 'Interno', escala: 'Vacante' },
        mission: 'Ejecutar recepciones físicas, proteger ascensores y asistir armado en terreno.',
        audit: 'Rol puente compartido entre Logística y Terreno para evitar tiempos muertos.',
        sops: ['LOG-01', 'TER-01'],
        kpis: ['Checklist 100% firmado', 'Retiro cartones día 1']
      },

      // NIVEL 4
      {
        id: 'log-ext', dept: 'LOG', level: 4,
        title: 'Talleres Externos & Bodega',
        status: { hoy: 'Externo', escala: 'Externo' },
        mission: 'Fabricar piezas especiales bajo plano y proveer acopio temporal por proyecto.',
        audit: 'Cero taller carpintero propio (costo fijo eliminado). Pago 100% variable.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Tolerancia +/- 2mm', 'Entrega puntual']
      },
      {
        id: 'ter-ext', dept: 'TER', level: 4,
        title: 'Cuadrillas, Aseo & Fotografía',
        status: { hoy: 'Externo', escala: 'Externo' },
        mission: 'Ejecutar pintura, instalaciones, aseo profundo y fotografía comercial Airbnb.',
        audit: 'Equipos variables contratados por obra bajo protocolo de Obra Limpia.',
        sops: ['TER-01', 'TER-02'],
        kpis: ['0 daños áreas comunes', 'Fotos listas en 48h']
      },
      {
        id: 'fin-ext', dept: 'FIN', level: 4,
        title: 'Contador & Asesor Tributario',
        status: { hoy: 'Externo', escala: 'Externo' },
        mission: 'Llevar contabilidad mensual, declaraciones F29/Renta y cumplimiento SII.',
        audit: 'Externalizado desde el día 1 mediante fee mensual fijo.',
        sops: ['FIN-01'],
        kpis: ['0 multas SII', 'Balance al día']
      }
    ];

    let state = {
      stage: 'hoy',
      showAudit: false,
      activeDept: 'ALL',
      selectedRoleId: null,
      deviceMode: window.innerWidth < 860 ? 'mobile' : 'desktop'
    };

    function getStatusIndicator(status) {
      if (status === 'Interno') {
        return { dot: 'bg-[#6E6862]', text: 'text-[#6E6862]', label: 'Equipo interno' };
      }
      if (status === 'Externo') {
        return { dot: 'bg-[#B59E84]', text: 'text-[#8C7760]', label: 'Aliado externo' };
      }
      return { dot: 'border border-[#7A353E] bg-transparent', text: 'text-[#7A353E]', label: 'Por incorporar' };
    }

    function setStage(stage) {
      state.stage = stage;
      ['hoy', 'escala'].forEach(s => {
        const btn = document.getElementById(`btn-stage-${s}`);
        btn.className = s === stage
          ? 'px-3.5 py-1 rounded-full font-medium transition-all bg-[#7A353E] text-[#FDFBF7] shadow-xs'
          : 'px-3.5 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]';
      });
      renderAll();
    }

    function toggleAudit() {
      state.showAudit = !state.showAudit;
      const btn = document.getElementById('btn-audit');
      btn.textContent = state.showAudit ? 'Auditoría: ON' : 'Auditoría: OFF';
      btn.className = state.showAudit
        ? 'px-3 py-1.5 rounded-full border border-[#7A353E] bg-[#7A353E] text-[#FDFBF7] text-[11px] tracking-wide font-medium transition-all'
        : 'px-3 py-1.5 rounded-full border border-[#DED5C8] bg-[#FDFBF7] text-[#6E6862] hover:border-[#7A353E]/40 hover:text-[#3A3532] text-[11px] tracking-wide font-medium transition-all';
      renderAll();
    }

    function setDeviceMode(mode) {
      state.deviceMode = mode;
      document.getElementById('btn-view-desktop').className = mode === 'desktop'
        ? 'px-3 py-1 rounded-full font-medium transition-all bg-[#FDFBF7] text-[#3A3532] shadow-xs'
        : 'px-3 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]';
      document.getElementById('btn-view-mobile').className = mode === 'mobile'
        ? 'px-3 py-1 rounded-full font-medium transition-all bg-[#FDFBF7] text-[#3A3532] shadow-xs'
        : 'px-3 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]';
      renderAll();
    }

    function setDeptFilter(deptId) {
      state.activeDept = deptId;
      renderAll();
    }

    function openRoleModal(roleId) {
      state.selectedRoleId = roleId;
      renderModal();
    }

    function closeModal() {
      state.selectedRoleId = null;
      document.getElementById('floating-modal').classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'floating-modal') {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.selectedRoleId) {
        closeModal();
      }
    });

    function changeRoleStatus(roleId, newStatus) {
      const role = rolesData.find(r => r.id === roleId);
      if (role) {
        role.status[state.stage] = newStatus;
        renderAll();
      }
    }

    function renderFiltersAndSummary() {
      const filtersEl = document.getElementById('dept-filters');
      const allActive = state.activeDept === 'ALL';
      let html = `
        <button onclick="setDeptFilter('ALL')" class="px-3 py-1 rounded-full font-medium transition-all shrink-0 ${allActive ? 'bg-[#3A3532] text-[#FDFBF7]' : 'text-[#6E6862] hover:bg-[#E8E0D4]'}">
          Todas las áreas
        </button>
      `;
      DEPARTMENTS.forEach(d => {
        const active = state.activeDept === d.id;
        html += `
          <button onclick="setDeptFilter('${d.id}')" class="px-3 py-1 rounded-full font-medium transition-all flex items-center gap-1.5 shrink-0 ${active ? 'bg-[#FDFBF7] text-[#3A3532] border border-[#D8CFC2] shadow-2xs' : 'text-[#6E6862] hover:bg-[#E8E0D4]'}">
            <span class="w-1.5 h-1.5 rounded-full" style="background:${d.color}"></span>
            <span>${d.name}</span>
          </button>
        `;
      });
      filtersEl.innerHTML = html;

      let counts = { 'Interno': 0, 'Vacante': 0, 'Externo': 0 };
      rolesData.forEach(r => {
        const s = r.status[state.stage];
        if (counts[s] !== undefined) counts[s]++;
      });
      document.getElementById('load-summary').innerHTML = `
        <span>Internos · <strong class="font-semibold text-[#3A3532]">${counts['Interno']}</strong></span>
        ${counts['Vacante'] > 0 ? `<span>Por incorporar · <strong class="font-semibold text-[#7A353E]">${counts['Vacante']}</strong></span>` : ''}
        <span>Externos · <strong class="font-semibold text-[#3A3532]">${counts['Externo']}</strong></span>
      `;
    }

    function renderLevelZeroBlock() {
      return `
        <div class="mb-7">
          <div onclick="openRoleModal('gerencia-general')" 
               class="role-card cursor-pointer max-w-xl mx-auto bg-[#FDFBF7] rounded-2xl border border-[#DFD5C7] px-6 py-5 shadow-[0_6px_24px_-8px_rgba(74,69,65,0.08)] text-center relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-[3px] bg-[#7A353E]"></div>
            <div class="text-[10px] uppercase tracking-[0.22em] text-[#7A353E] font-semibold mb-1.5">
              Nivel 0 · Gobierno Corporativo
            </div>
            <h2 class="font-editorial text-2xl md:text-[26px] font-semibold text-[#3A3532] leading-tight">
              Gerencia General · Socias Fundadoras
            </h2>
            <p class="text-xs text-[#857E77] mt-1 tracking-wide">
              Dirección Ejecutiva, Estrategia y Gobernanza Transversal
            </p>
          </div>

          <!-- Líneas conectoras arquitectónicas -->
          <div class="flex flex-col items-center">
            <div class="w-px h-5 bg-[#D4CBC0]"></div>
            <div class="w-4/5 max-w-4xl h-px bg-[#D4CBC0] hidden md:block"></div>
          </div>
        </div>
      `;
    }

    function renderRoleCard(role, dept) {
      const currentStatus = role.status[state.stage];
      const ind = getStatusIndicator(currentStatus);

      return `
        <div onclick="openRoleModal('${role.id}')" 
             class="role-card group cursor-pointer bg-[#FDFBF7] rounded-xl border border-[#E6DFD5] p-4 flex flex-col justify-between gap-3">
          <div class="flex items-start justify-between gap-2">
            <div class="text-[13.5px] font-medium text-[#3A3532] leading-snug group-hover:text-[#7A353E] transition-colors">
              ${role.title}
            </div>
            <span class="w-1.5 h-1.5 rounded-full shrink-0 mt-1.5 opacity-75" style="background:${dept.color}"></span>
          </div>
          
          <div class="flex items-center justify-between gap-2 pt-1">
            <div class="flex items-center gap-1.5 text-[11px] ${ind.text}">
              <span class="w-1.5 h-1.5 rounded-full ${ind.dot}"></span>
              <span>${ind.label}</span>
            </div>
            <span class="text-[11px] text-[#B0A79D] group-hover:text-[#7A353E] group-hover:translate-x-0.5 transition-all">→</span>
          </div>

          ${state.showAudit ? `
            <div class="pt-2.5 border-t border-[#EFE9E0] text-[11px] text-[#7A353E] leading-relaxed italic">
              ${role.audit}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderCanvas() {
      const canvas = document.getElementById('org-canvas');
      const visibleDepts = state.activeDept === 'ALL'
        ? DEPARTMENTS
        : DEPARTMENTS.filter(d => d.id === state.activeDept);

      const levelZeroHtml = renderLevelZeroBlock();

      if (state.deviceMode === 'mobile') {
        let html = `<div class="max-w-md mx-auto">${levelZeroHtml}<div class="space-y-6">`;
        visibleDepts.forEach(dept => {
          const deptRoles = rolesData.filter(r => r.dept === dept.id);
          html += `
            <section class="bg-[#F3EFE8]/70 rounded-2xl border border-[#E5DDD2] p-4">
              <div class="flex items-center justify-between mb-3.5 pb-2.5 border-b border-[#E5DDD2]">
                <div class="flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full" style="background:${dept.color}"></span>
                  <h2 class="font-editorial text-lg font-semibold text-[#3A3532]">${dept.name}</h2>
                </div>
                <span class="text-[10px] tracking-widest uppercase text-[#999188]">${dept.id}</span>
              </div>
              <div class="space-y-3">
                ${deptRoles.map(r => `
                  <div>
                    <div class="text-[10px] uppercase tracking-widest text-[#999188] mb-1">Nivel ${r.level}</div>
                    ${renderRoleCard(r, dept)}
                  </div>
                `).join('')}
              </div>
            </section>
          `;
        });
        html += `</div></div>`;
        canvas.innerHTML = html;
        return;
      }

      const gridCols = visibleDepts.length === 1 ? 'grid-cols-1 max-w-md mx-auto' : 'grid-cols-5';
      let html = `${levelZeroHtml}<div class="overflow-x-auto pb-6"><div class="min-w-[980px]">`;

      // Encabezados de departamento estilo editorial
      html += `<div class="grid ${gridCols} gap-4 mb-4">`;
      visibleDepts.forEach(dept => {
        html += `
          <div class="bg-[#FDFBF7] rounded-xl border border-[#E6DFD5] px-4 py-3 text-center relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-[2.5px]" style="background:${dept.color}"></div>
            <div class="text-[9.5px] uppercase tracking-[0.2em] text-[#999188] mb-0.5">${dept.id}</div>
            <div class="font-editorial text-[17px] font-semibold text-[#3A3532] leading-tight">${dept.name}</div>
          </div>
        `;
      });
      html += `</div>`;

      // Bandas horizontales suaves por nivel
      html += `<div class="space-y-4">`;
      LEVELS.forEach(lvl => {
        html += `
          <div class="bg-[#F3EFE8]/60 rounded-2xl border border-[#EAE2D6] p-4">
            <div class="flex items-center gap-2 mb-3 px-1">
              <span class="font-editorial italic text-sm text-[#7A353E] font-semibold">Nivel ${lvl.num}</span>
              <span class="text-[#C7BEB2]">·</span>
              <span class="text-[11px] uppercase tracking-[0.16em] text-[#857E77]">${lvl.title}</span>
            </div>
            <div class="grid ${gridCols} gap-4">
              ${visibleDepts.map(dept => {
                const cellRoles = rolesData.filter(r => r.dept === dept.id && r.level === lvl.id);
                if (cellRoles.length === 0) {
                  return `<div class="rounded-xl border border-dashed border-[#E2D9CC] min-h-[82px] flex items-center justify-center text-xs text-[#C4BBB0] font-editorial italic">—</div>`;
                }
                return `<div class="space-y-3">${cellRoles.map(r => renderRoleCard(r, dept)).join('')}</div>`;
              }).join('')}
            </div>
          </div>
        `;
      });
      html += `</div></div></div>`;
      canvas.innerHTML = html;
    }

    function renderModal() {
      const modal = document.getElementById('floating-modal');
      const content = document.getElementById('modal-content');

      if (!state.selectedRoleId) {
        modal.classList.add('hidden');
        return;
      }

      // Caso Nivel 0
      if (state.selectedRoleId === 'gerencia-general') {
        const exec = EXECUTIVE_ROLE;
        modal.classList.remove('hidden');
        content.innerHTML = `
          <div class="flex items-start justify-between gap-4 pb-4 border-b border-[#ECE4D8]">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.2em] text-[#7A353E] mb-1">
                Nivel 0 · Gobierno Corporativo
              </div>
              <h3 class="font-editorial text-2xl font-semibold text-[#3A3532] leading-snug">${exec.title}</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full border border-[#E2D9CC] bg-[#F8F5F0] hover:bg-[#EFE9E0] text-[#6E6862] flex items-center justify-center text-xs transition-colors shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-5 space-y-5 text-xs">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-1.5">Responsabilidad Ejecutiva</div>
              <p class="text-[#4A4541] text-[13.5px] leading-relaxed">${exec.mission}</p>
            </div>

            <div class="bg-[#F6F1E9] border border-[#E8DEC9] rounded-xl p-4">
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#7A353E] mb-1">Criterio Ultra-Lean</div>
              <p class="text-[#5C4E50] leading-relaxed">${exec.audit}</p>
            </div>

            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-2">SOPs Clave Supervisados</div>
              <div class="space-y-2">
                ${exec.sops.map(code => `
                  <div class="bg-white border border-[#EAE2D6] rounded-xl p-3">
                    <div class="font-semibold text-[#7A353E] mb-0.5">${code}</div>
                    <div class="text-[#6E6862] leading-relaxed">${SOP_DETAILS[code] || ''}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-2">Indicadores Globales</div>
              <div class="flex flex-wrap gap-2">
                ${exec.kpis.map(k => `
                  <span class="px-3 py-1 rounded-full bg-[#F3EFE8] border border-[#E5DDD2] text-[#4A4541]">${k}</span>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      const role = rolesData.find(r => r.id === state.selectedRoleId);
      if (!role) return;

      const dept = DEPARTMENTS.find(d => d.id === role.dept);
      const currentStatus = role.status[state.stage];
      modal.classList.remove('hidden');

      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 pb-4 border-b border-[#ECE4D8]">
          <div>
            <div class="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.18em] mb-1" style="color:${dept.color}">
              <span>${dept.id} · ${dept.name}</span>
              <span>·</span>
              <span>Nivel ${role.level}</span>
            </div>
            <h3 class="font-editorial text-2xl font-semibold text-[#3A3532] leading-snug">${role.title}</h3>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full border border-[#E2D9CC] bg-[#F8F5F0] hover:bg-[#EFE9E0] text-[#6E6862] flex items-center justify-center text-xs transition-colors shrink-0">
            ✕
          </button>
        </div>

        <div class="mt-5 space-y-5 text-xs">
          <!-- Misión -->
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-1.5">Responsabilidad Principal</div>
            <p class="text-[#4A4541] text-[13.5px] leading-relaxed">${role.mission}</p>
          </div>

          <!-- Criterio Lean -->
          <div class="bg-[#F6F1E9] border border-[#E8DEC9] rounded-xl p-4">
            <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#7A353E] mb-1">Criterio Ultra-Lean</div>
            <p class="text-[#5C4E50] leading-relaxed">${role.audit}</p>
          </div>

          <!-- Modalidad -->
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-2">Modalidad en etapa (${state.stage === 'hoy' ? 'Hoy' : 'Escala'})</div>
            <div class="grid grid-cols-3 gap-2">
              ${['Interno', 'Vacante', 'Externo'].map(opt => `
                <button onclick="changeRoleStatus('${role.id}', '${opt}')"
                  class="py-2 px-2.5 rounded-lg border text-center font-medium transition-all ${currentStatus === opt ? 'bg-[#7A353E] text-[#FDFBF7] border-[#7A353E]' : 'bg-white text-[#4A4541] border-[#E5DDD2] hover:border-[#7A353E]/50'}">
                  ${opt === 'Interno' ? 'Equipo Interno' : opt === 'Vacante' ? 'Por incorporar' : 'Externo'}
                </button>
              `).join('')}
            </div>
          </div>

          <!-- SOPs Asociados -->
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-2">SOPs Vinculados</div>
            <div class="space-y-2">
              ${role.sops.map(code => `
                <div class="bg-white border border-[#EAE2D6] rounded-xl p-3">
                  <div class="font-semibold text-[#7A353E] mb-0.5">${code}</div>
                  <div class="text-[#6E6862] leading-relaxed">${SOP_DETAILS[code] || ''}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- KPIs -->
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#999188] mb-2">Indicadores Clave</div>
            <div class="flex flex-wrap gap-2">
              ${role.kpis.map(k => `
                <span class="px-3 py-1 rounded-full bg-[#F3EFE8] border border-[#E5DDD2] text-[#4A4541]">${k}</span>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      renderFiltersAndSummary();
      renderCanvas();
      renderModal();
    }

    renderAll();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigrama Estudio Afín | Roles y Estructura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F8F5F0;
      color: #4A4541;
      -webkit-font-smoothing: antialiased;
    }
    .role-card {
      position: relative;
      z-index: 10;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease, opacity 0.22s ease;
    }
    .role-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -10px rgba(74, 69, 65, 0.14);
      border-color: #B89B9E;
    }
    .role-card.is-highlighted {
      border-color: #7A353E !important;
      box-shadow: 0 10px 24px -8px rgba(122, 53, 62, 0.22);
      background-color: #FFFDFB;
    }
    .role-card.is-dimmed {
      opacity: 0.36;
      filter: grayscale(25%);
    }
    .role-card.is-dimmed:hover {
      opacity: 0.85;
      filter: none;
    }
    @keyframes modalFade {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-animate {
      animation: modalFade 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #F2EDE4; }
    ::-webkit-scrollbar-thumb { background: #D4CBC0; border-radius: 2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#7A353E]/15 selection:text-[#7A353E]">

  <!-- CABECERA MINIMALISTA -->
  <header class="bg-[#F8F5F0]/95 backdrop-blur-md border-b border-[#E5DDD2] sticky top-0 z-30">
    <div class="max-w-[1400px] mx-auto px-5 md:px-8 py-3.5 flex flex-wrap items-center justify-between gap-3">
      
      <!-- Identidad y Título -->
      <div class="flex items-baseline gap-2.5">
        <h1 class="text-lg md:text-xl font-semibold tracking-tight text-[#3A3532]">
          Organigrama Estudio Afín
        </h1>
        <span class="hidden sm:inline-block text-[#C4BBB0] font-light">|</span>
        <span class="text-sm md:text-[15px] font-normal text-[#7A353E]">
          Roles y Estructura
        </span>
      </div>

      <!-- Controles Refinados + Buscador Rápido -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Buscador Rápido de Roles o SOPs -->
        <div class="relative">
          <input
            type="text"
            id="quick-search"
            oninput="handleSearch(this.value)"
            placeholder="Buscar cargo o SOP (ej. COM-04)..."
            class="w-48 sm:w-60 pl-7 pr-7 py-1.5 rounded-full border border-[#DED5C8] bg-[#FDFBF7] text-[11.5px] text-[#3A3532] placeholder-[#A39A90] focus:outline-none focus:border-[#7A353E] transition-all"
          />
          <svg class="w-3.5 h-3.5 text-[#999188] absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <button
            id="btn-clear-search"
            onclick="clearFilters()"
            title="Limpiar filtro"
            class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-[#857E77] hover:text-[#7A353E] font-semibold px-1"
          >✕</button>
        </div>

        <!-- Etapa: Hoy vs Escala -->
        <div class="bg-[#EFE9E0] p-0.5 rounded-full border border-[#E2D9CC] flex items-center text-[11px] tracking-wide">
          <button onclick="setStage('hoy')" id="btn-stage-hoy" class="px-3 py-1 rounded-full font-medium transition-all bg-[#7A353E] text-[#FDFBF7] shadow-2xs">
            Hoy
          </button>
          <button onclick="setStage('escala')" id="btn-stage-escala" class="px-3 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]">
            Escala
          </button>
        </div>

        <!-- Auditoría -->
        <button onclick="toggleAudit()" id="btn-audit" class="px-3 py-1.5 rounded-full border border-[#DED5C8] bg-[#FDFBF7] text-[#6E6862] hover:border-[#7A353E]/40 hover:text-[#3A3532] text-[11px] tracking-wide font-medium transition-all">
          Auditoría: OFF
        </button>

        <!-- Vista PC / Móvil -->
        <div class="bg-[#EFE9E0] p-0.5 rounded-full border border-[#E2D9CC] flex items-center text-[11px] tracking-wide">
          <button onclick="setDeviceMode('desktop')" id="btn-view-desktop" class="px-2.5 py-1 rounded-full font-medium transition-all bg-[#FDFBF7] text-[#3A3532] shadow-2xs">
            PC
          </button>
          <button onclick="setDeviceMode('mobile')" id="btn-view-mobile" class="px-2.5 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]">
            Móvil
          </button>
        </div>
      </div>
    </div>

    <!-- Sub-barra de navegación por áreas -->
    <div class="bg-[#F3EFE8]/80 border-t border-[#EAE2D6] px-5 md:px-8 py-2">
      <div class="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-3 text-[11.5px]">
        <div id="dept-filters" class="flex items-center gap-1.5 overflow-x-auto pb-0.5 md:pb-0">
          <!-- Render dinámico -->
        </div>
        <div id="load-summary" class="flex items-center gap-4 text-[11px] text-[#857E77] tracking-wide">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

    <!-- Banner dinámico cuando hay un SOP o búsqueda activa -->
    <div id="active-sop-banner" class="hidden bg-[#FDFBF7] border-t border-[#DFD2C3] px-5 md:px-8 py-2.5">
      <!-- Render dinámico -->
    </div>
  </header>

  <!-- LIENZO PRINCIPAL -->
  <main class="flex-1 max-w-[1400px] w-full mx-auto px-5 md:px-8 py-7">
    <div id="org-canvas" class="w-full">
      <!-- Renderizado dinámico -->
    </div>
  </main>

  <!-- MODAL FLOTANTE -->
  <div id="floating-modal" onclick="handleBackdropClick(event)" class="hidden fixed inset-0 z-50 bg-[#4A4541]/25 backdrop-blur-[3px] flex items-center justify-center p-4">
    <div class="modal-animate w-full max-w-lg max-h-[88vh] overflow-y-auto bg-[#FDFBF7] rounded-2xl border border-[#E2D9CC] shadow-[0_24px_48px_-12px_rgba(58,53,50,0.18)] p-6 md:p-7">
      <div id="modal-content"></div>
    </div>
  </div>

  <script>

    const EXECUTIVE_ROLE = {

        audit: 'Absorbe dirección de compras y control de proveedores bajo una sola cabeza.',

      },

        mission: 'Asegurar ejecución llave en mano sin fricciones en edificios y entrega conforme.',

      {

        audit: 'Contratación prioritaria #1 en crecimiento para liberar carga operativa.',
        sops: ['LOG-01', 'LOG-02'],
        kpis: ['Rechazo en 24h', '0 mermas en bodega']
      },
      {
        id: 'ter-lead', dept: 'TER', level: 2,

        status: { hoy: 'Interno', escala: 'Vacante' },

        sops: ['TER-01', 'TER-02'],
        kpis: ['Obra limpia 100%', '0 multas edificio']
      },
      {

        audit: 'Se mantiene interno hasta escala; contabilidad tributaria va 100% externa.',

        kpis: ['Cobro 100% pre-compra', 'Cierre Open Book']

      // NIVEL 3
      {
        id: 'dis-exec', dept: 'DIS', level: 3,

        audit: 'Contratación de apoyo en crecimiento para liberar horas operativas de diseño.',
        sops: ['DIS-01', 'COM-04'],

      {

    let state = {
      stage: 'hoy',
      showAudit: false,
      activeDept: 'ALL',
      activeSop: null,
      searchQuery: '',
      selectedRoleId: null,
      deviceMode: window.innerWidth < 860 ? 'mobile' : 'desktop'
    };

    function getStatusIndicator(status) {
      if (status === 'Interno') {
        return { dot: 'bg-[#6E6862]', text: 'text-[#6E6862]', label: 'Equipo interno' };
      }
      if (status === 'Externo') {
        return { dot: 'bg-[#B59E84]', text: 'text-[#8C7760]', label: 'Aliado externo' };
      }
      return { dot: 'border border-[#7A353E] bg-transparent', text: 'text-[#7A353E]', label: 'Por incorporar' };
    }

    function setStage(stage) {
      state.stage = stage;
      ['hoy', 'escala'].forEach(s => {
        const btn = document.getElementById(`btn-stage-${s}`);
        btn.className = s === stage
          ? 'px-3 py-1 rounded-full font-medium transition-all bg-[#7A353E] text-[#FDFBF7] shadow-2xs'
          : 'px-3 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]';
      });
      renderAll();
    }

    function toggleAudit() {
      state.showAudit = !state.showAudit;
      const btn = document.getElementById('btn-audit');
      btn.textContent = state.showAudit ? 'Auditoría: ON' : 'Auditoría: OFF';
      btn.className = state.showAudit
        ? 'px-3 py-1.5 rounded-full border border-[#7A353E] bg-[#7A353E] text-[#FDFBF7] text-[11px] tracking-wide font-medium transition-all'
        : 'px-3 py-1.5 rounded-full border border-[#DED5C8] bg-[#FDFBF7] text-[#6E6862] hover:border-[#7A353E]/40 hover:text-[#3A3532] text-[11px] tracking-wide font-medium transition-all';
      renderAll();
    }

    function setDeviceMode(mode) {
      state.deviceMode = mode;
      document.getElementById('btn-view-desktop').className = mode === 'desktop'
        ? 'px-2.5 py-1 rounded-full font-medium transition-all bg-[#FDFBF7] text-[#3A3532] shadow-2xs'
        : 'px-2.5 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]';
      document.getElementById('btn-view-mobile').className = mode === 'mobile'
        ? 'px-2.5 py-1 rounded-full font-medium transition-all bg-[#FDFBF7] text-[#3A3532] shadow-2xs'
        : 'px-2.5 py-1 rounded-full font-medium transition-all text-[#6E6862] hover:text-[#3A3532]';
      renderAll();
    }

    function setDeptFilter(deptId) {
      state.activeDept = deptId;
      renderAll();
    }

    function toggleSopFilter(sopCode, event) {
      if (event) event.stopPropagation();
      if (state.activeSop === sopCode) {
        state.activeSop = null;
      } else {
        state.activeSop = sopCode;
        // Si estaba filtrada otra área que no tiene ese SOP, volver a mostrar todas para ver la transversalidad
        if (state.activeDept !== 'ALL') {
          const deptHasRoles = rolesData.some(r => r.dept === state.activeDept && r.sops.includes(sopCode));
          if (!deptHasRoles) state.activeDept = 'ALL';
        }
      }
      renderAll();
    }

    function handleSearch(val) {
      state.searchQuery = val.trim();
      const clearBtn = document.getElementById('btn-clear-search');
      if (state.searchQuery.length > 0 || state.activeSop) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      // Si escribe exactamente un código SOP válido (ej. com-04), sincronizamos visualmente
      const upper = state.searchQuery.toUpperCase();
      if (SOP_DETAILS[upper]) {
        state.activeSop = upper;
      } else if (state.searchQuery.length > 0) {
        state.activeSop = null;
      }
      renderAll();
    }

    function clearFilters() {
      state.activeSop = null;
      state.searchQuery = '';
      const input = document.getElementById('quick-search');
      if (input) input.value = '';
      document.getElementById('btn-clear-search').classList.add('hidden');
      renderAll();
    }

    function openRoleModal(roleId) {
      state.selectedRoleId = roleId;
      renderModal();
    }

    function closeModal() {
      state.selectedRoleId = null;
      document.getElementById('floating-modal').classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'floating-modal') {
        closeModal();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.selectedRoleId) {
        closeModal();
      }
    });

    function changeRoleStatus(roleId, newStatus) {
      const role = rolesData.find(r => r.id === roleId);
      if (role) {
        role.status[state.stage] = newStatus;
        renderAll();
      }
    }

    function isRoleMatch(role) {
      if (state.activeSop) {
        return role.sops.includes(state.activeSop);
      }
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        const inTitle = role.title.toLowerCase().includes(q);
        const inMission = role.mission.toLowerCase().includes(q);
        const inSops = role.sops.some(code => {
          const sopObj = SOP_DETAILS[code];
          return code.toLowerCase().includes(q) || (sopObj && sopObj.title.toLowerCase().includes(q));
        });
        return inTitle || inMission || inSops;
      }
      return true;
    }

    function hasActiveFilter() {
      return Boolean(state.activeSop || state.searchQuery);
    }

    function renderFiltersAndSummary() {
      const filtersEl = document.getElementById('dept-filters');
      const allActive = state.activeDept === 'ALL';
      let html = `
        <button onclick="setDeptFilter('ALL')" class="px-3 py-1 rounded-full font-medium transition-all shrink-0 ${allActive ? 'bg-[#3A3532] text-[#FDFBF7]' : 'text-[#6E6862] hover:bg-[#E8E0D4]'}">
          Todas las áreas
        </button>
      `;
      DEPARTMENTS.forEach(d => {
        const active = state.activeDept === d.id;
        html += `
          <button onclick="setDeptFilter('${d.id}')" class="px-3 py-1 rounded-full font-medium transition-all flex items-center gap-1.5 shrink-0 ${active ? 'bg-[#FDFBF7] text-[#3A3532] border border-[#D8CFC2] shadow-2xs' : 'text-[#6E6862] hover:bg-[#E8E0D4]'}">
            <span class="w-1.5 h-1.5 rounded-full" style="background:${d.color}"></span>
            <span>${d.name}</span>
          </button>
        `;
      });
      filtersEl.innerHTML = html;

      let counts = { 'Interno': 0, 'Vacante': 0, 'Externo': 0 };
      rolesData.forEach(r => {
        const s = r.status[state.stage];
        if (counts[s] !== undefined) counts[s]++;
      });
      document.getElementById('load-summary').innerHTML = `
        <span>SOPs · <strong class="font-semibold text-[#3A3532]">10</strong></span>
        <span>Internos · <strong class="font-semibold text-[#3A3532]">${counts['Interno']}</strong></span>
        ${counts['Vacante'] > 0 ? `<span>Por incorporar · <strong class="font-semibold text-[#7A353E]">${counts['Vacante']}</strong></span>` : ''}
        <span>Externos · <strong class="font-semibold text-[#3A3532]">${counts['Externo']}</strong></span>
      `;

      // Banner contextual cuando hay un SOP seleccionado
      const bannerEl = document.getElementById('active-sop-banner');
      const clearBtn = document.getElementById('btn-clear-search');
      if (state.activeSop && SOP_DETAILS[state.activeSop]) {
        const sop = SOP_DETAILS[state.activeSop];
        const matchingCount = rolesData.filter(r => r.sops.includes(state.activeSop)).length;
        bannerEl.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
        bannerEl.innerHTML = `
          <div class="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex flex-wrap items-center gap-2.5">
              <span class="px-2 py-0.5 rounded bg-[#7A353E] text-[#FDFBF7] text-[10.5px] font-semibold tracking-wider">
                ${state.activeSop} · ${sop.version}
              </span>
              <span class="font-semibold text-[#3A3532]">${sop.title}:</span>
              <span class="text-[#6E6862]">${sop.desc}</span>
            </div>
            <div class="flex items-center gap-3 shrink-0">
              <span class="text-[11px] text-[#7A353E] font-medium">${matchingCount} cargos vinculados</span>
              <button onclick="clearFilters()" class="px-2.5 py-1 rounded-full border border-[#D8CFC2] bg-[#F8F5F0] hover:bg-[#EFE9E0] text-[#4A4541] text-[11px] font-medium transition-colors">
                Ver todos ✕
              </button>
            </div>
          </div>
        `;
      } else if (state.searchQuery) {
        const matchingCount = rolesData.filter(r => isRoleMatch(r)).length;
        bannerEl.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
        bannerEl.innerHTML = `
          <div class="max-w-[1400px] mx-auto flex items-center justify-between gap-3 text-xs">
            <span class="text-[#6E6862]">
              Filtrando por <strong class="text-[#3A3532]">"${state.searchQuery}"</strong> · <strong class="text-[#7A353E]">${matchingCount}</strong> coincidencias
            </span>
            <button onclick="clearFilters()" class="px-2.5 py-1 rounded-full border border-[#D8CFC2] bg-[#F8F5F0] hover:bg-[#EFE9E0] text-[#4A4541] text-[11px] font-medium transition-colors">
              Limpiar ✕
            </button>
          </div>
        `;
      } else {
        bannerEl.classList.add('hidden');
        clearBtn.classList.add('hidden');
      }
    }

    function renderLevelZeroCard() {
      const filtering = hasActiveFilter();
      const matches = isRoleMatch(EXECUTIVE_ROLE);
      const stateClass = filtering ? (matches ? 'is-highlighted' : 'is-dimmed') : '';

      return `
        <div onclick="openRoleModal('gerencia-general')" 
             class="role-card ${stateClass} cursor-pointer max-w-xl mx-auto bg-[#FDFBF7] rounded-2xl border border-[#DFD5C7] px-6 py-5 shadow-[0_6px_24px_-8px_rgba(74,69,65,0.08)] text-center relative overflow-hidden">
          <div class="absolute top-0 inset-x-0 h-[3px] bg-[#7A353E]"></div>
          <div class="text-[10px] uppercase tracking-[0.2em] text-[#7A353E] font-semibold mb-1.5">
            Nivel 0 · Gobierno Corporativo
          </div>
          <h2 class="text-lg md:text-xl font-semibold tracking-tight text-[#3A3532] leading-snug">
            Gerencia General · Socias Fundadoras
          </h2>
          <p class="text-xs text-[#857E77] mt-1">
            Dirección Ejecutiva, Estrategia y Gobernanza Transversal
          </p>
        </div>
      `;
    }

    function renderDeptSopNav(dept) {
      return `
        <div class="mt-2.5 pt-2.5 border-t border-[#EFE9E0] flex flex-wrap items-center justify-center gap-1">
          ${dept.sops.map(code => {
            const isSelected = state.activeSop === code;
            const sopInfo = SOP_DETAILS[code];
            return `
              <button
                onclick="toggleSopFilter('${code}', event)"
                title="${sopInfo ? sopInfo.title : code}"
                class="px-2 py-0.5 rounded-md text-[10px] font-medium tracking-wide transition-all ${
                  isSelected
                    ? 'bg-[#7A353E] text-[#FDFBF7] shadow-2xs'
                    : 'bg-[#F3EFE8] text-[#6E6862] hover:bg-[#E6DFD5] hover:text-[#3A3532]'
                }"
              >
                ${code}
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderRoleCard(role, dept) {
      const currentStatus = role.status[state.stage];
      const ind = getStatusIndicator(currentStatus);
      const filtering = hasActiveFilter();
      const matches = isRoleMatch(role);
      const stateClass = filtering ? (matches ? 'is-highlighted' : 'is-dimmed') : '';

      return `
        <div onclick="openRoleModal('${role.id}')" 
             class="role-card ${stateClass} group cursor-pointer bg-[#FDFBF7] rounded-xl border border-[#E6DFD5] p-4 flex flex-col justify-between gap-3">
          <div class="flex items-start justify-between gap-2">
            <div class="text-[13px] font-medium text-[#3A3532] leading-snug group-hover:text-[#7A353E] transition-colors">
              ${role.title}
            </div>
            <span class="w-1.5 h-1.5 rounded-full shrink-0 mt-1.5 opacity-75" style="background:${dept.color}"></span>
          </div>

          ${state.activeSop && matches ? `
            <div class="flex items-center gap-1.5">
              <span class="px-1.5 py-0.5 rounded bg-[#7A353E]/10 text-[#7A353E] text-[10px] font-semibold">
                Ejecuta ${state.activeSop}
              </span>
            </div>
          ` : ''}
          
          <div class="flex items-center justify-between gap-2 pt-1">
            <div class="flex items-center gap-1.5 text-[11px] ${ind.text}">
              <span class="w-1.5 h-1.5 rounded-full ${ind.dot}"></span>
              <span>${ind.label}</span>
            </div>
            <span class="text-[11px] text-[#B0A79D] group-hover:text-[#7A353E] group-hover:translate-x-0.5 transition-all">→</span>
          </div>

          ${state.showAudit ? `
            <div class="pt-2.5 border-t border-[#EFE9E0] text-[11px] text-[#7A353E] leading-relaxed">
              ${role.audit}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderCanvas() {
      const canvas = document.getElementById('org-canvas');
      const visibleDepts = state.activeDept === 'ALL'
        ? DEPARTMENTS
        : DEPARTMENTS.filter(d => d.id === state.activeDept);

      const levelZeroCard = renderLevelZeroCard();

      if (state.deviceMode === 'mobile') {
        let html = `
          <div class="max-w-md mx-auto">
            ${levelZeroCard}
            <div class="flex justify-center">
              <div class="w-px h-6 bg-[#CFC6BA]"></div>
            </div>
            <div class="space-y-6">
        `;
        visibleDepts.forEach(dept => {
          const deptRoles = rolesData.filter(r => r.dept === dept.id);
          html += `
            <section class="bg-[#F3EFE8]/70 rounded-2xl border border-[#E5DDD2] p-4 relative">
              <div class="pb-3 mb-3.5 border-b border-[#E5DDD2]">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full" style="background:${dept.color}"></span>
                    <h2 class="text-sm font-semibold text-[#3A3532]">${dept.name}</h2>
                  </div>
                  <span class="text-[10px] tracking-widest uppercase text-[#999188]">${dept.id}</span>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2.5">
                  ${dept.sops.map(code => {
                    const isSelected = state.activeSop === code;
                    return `
                      <button onclick="toggleSopFilter('${code}', event)"
                        class="px-2 py-0.5 rounded-md text-[10px] font-medium transition-all ${
                          isSelected ? 'bg-[#7A353E] text-[#FDFBF7]' : 'bg-[#FDFBF7] border border-[#E2D9CC] text-[#6E6862]'
                        }">
                        ${code}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
              <div class="relative pl-4 space-y-3">
                <div class="absolute left-1.5 top-2 bottom-4 w-px bg-[#D4CBC0]"></div>
                ${deptRoles.map(r => `
                  <div class="relative">
                    <div class="absolute -left-2.5 top-5 w-2.5 h-px bg-[#D4CBC0]"></div>
                    <div class="text-[10px] uppercase tracking-widest text-[#999188] mb-1">Nivel ${r.level}</div>
                    ${renderRoleCard(r, dept)}
                  </div>
                `).join('')}
              </div>
            </section>
          `;
        });
        html += `</div></div>`;
        canvas.innerHTML = html;
        return;
      }

      // VISTA ESCRITORIO CON TRAZADO JERÁRQUICO Y NAVEGACIÓN DE SOPs POR DEPARTAMENTO
      const isSingle = visibleDepts.length === 1;
      const gridCols = isSingle ? 'grid-cols-1 max-w-md mx-auto' : 'grid-cols-5';

      const topBranchHtml = isSingle
        ? `<div class="flex justify-center"><div class="w-px h-8 bg-[#CFC6BA]"></div></div>`
        : `
          <div class="relative h-9">
            <div class="absolute left-1/2 top-0 w-px h-4 -translate-x-1/2 bg-[#CFC6BA]"></div>
            <div class="absolute top-4 left-[10%] right-[10%] h-px bg-[#CFC6BA]"></div>
            <div class="grid grid-cols-5 gap-4 h-full">
              ${visibleDepts.map(() => `
                <div class="relative h-full">
                  <div class="absolute left-1/2 top-4 bottom-0 w-px -translate-x-1/2 bg-[#CFC6BA]"></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;

      let html = `
        ${levelZeroCard}
        <div class="overflow-x-auto pb-6">
          <div class="${isSingle ? 'max-w-md mx-auto' : 'min-w-[1000px]'}">
            
            ${topBranchHtml}

            <!-- Encabezados de Departamento con Navegador de SOPs integrado -->
            <div class="grid ${gridCols} gap-4 relative z-10">
              ${visibleDepts.map(dept => `
                <div class="bg-[#FDFBF7] rounded-xl border border-[#DFD6C9] px-3.5 py-3 text-center relative overflow-hidden shadow-[0_2px_10px_-4px_rgba(74,69,65,0.06)] flex flex-col justify-between">
                  <div class="absolute top-0 inset-x-0 h-[2.5px]" style="background:${dept.color}"></div>
                  <div>
                    <div class="text-[9.5px] uppercase tracking-[0.2em] text-[#999188] mb-1">${dept.id}</div>
                    <div class="text-[13px] font-semibold tracking-tight text-[#3A3532] leading-tight">${dept.name}</div>
                  </div>
                  ${renderDeptSopNav(dept)}
                </div>
              `).join('')}
            </div>

            <!-- Contenedor de Bandas con Líneas Verticales Continuas de Reporte -->
            <div class="relative pt-4">
              <div class="grid ${gridCols} gap-4 absolute inset-0 pointer-events-none z-0">
                ${visibleDepts.map(dept => {
                  const maxLvl = Math.max(...rolesData.filter(r => r.dept === dept.id).map(r => r.level));
                  const lineHeightClass = maxLvl === 4 ? 'bottom-8' : 'bottom-[24%]';
                  return `
                    <div class="relative h-full">
                      <div class="absolute left-1/2 top-0 ${lineHeightClass} w-px -translate-x-1/2 bg-[#D6CEC2]"></div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- Bandas por Nivel Jerárquico -->
              <div class="space-y-4 relative z-10">
                ${LEVELS.map(lvl => `
                  <div class="bg-[#F3EFE8]/55 rounded-2xl border border-[#EAE2D6] p-4">
                    <div class="flex items-center gap-2 mb-3 px-1">
                      <span class="text-[11px] font-semibold text-[#7A353E]">Nivel ${lvl.num}</span>
                      <span class="text-[#C7BEB2]">·</span>
                      <span class="text-[11px] uppercase tracking-[0.14em] text-[#857E77] font-medium">${lvl.title}</span>
                    </div>
                    <div class="grid ${gridCols} gap-4">
                      ${visibleDepts.map(dept => {
                        const cellRoles = rolesData.filter(r => r.dept === dept.id && r.level === lvl.id);
                        if (cellRoles.length === 0) {
                          return `<div class="min-h-[82px] flex items-center justify-center"></div>`;
                        }
                        return `
                          <div class="space-y-3 relative">
                            ${cellRoles.map(r => `
                              <div class="relative">
                                <div class="w-1.5 h-1.5 rounded-full bg-[#CFC6BA] mx-auto -mb-[3px] relative z-20 ring-2 ring-[#F8F5F0]"></div>
                                ${renderRoleCard(r, dept)}
                              </div>
                            `).join('')}
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>

            </div>
          </div>
        </div>
      `;
      canvas.innerHTML = html;
    }

    function renderSopListInModal(sops) {
      return sops.map(code => {
        const sop = SOP_DETAILS[code];
        if (!sop) return '';
        return `
          <div onclick="closeModal(); toggleSopFilter('${code}');" 
               class="cursor-pointer group bg-white border border-[#EAE2D6] hover:border-[#7A353E]/50 rounded-xl p-3 transition-all">
            <div class="flex items-center justify-between gap-2 mb-1">
              <div class="font-semibold text-[#7A353E] group-hover:underline">
                ${code} · ${sop.title}
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#F3EFE8] text-[#78726C] font-medium shrink-0">
                ${sop.version}
              </span>
            </div>
            <div class="text-[#6E6862] leading-relaxed">${sop.desc}</div>
          </div>
        `;
      }).join('');
    }

    function renderModal() {
      const modal = document.getElementById('floating-modal');
      const content = document.getElementById('modal-content');

      if (!state.selectedRoleId) {
        modal.classList.add('hidden');
        return;
      }

      if (state.selectedRoleId === 'gerencia-general') {
        const exec = EXECUTIVE_ROLE;
        modal.classList.remove('hidden');
        content.innerHTML = `
          <div class="flex items-start justify-between gap-4 pb-4 border-b border-[#ECE4D8]">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.18em] text-[#7A353E] mb-1">
                Nivel 0 · Gobierno Corporativo
              </div>
              <h3 class="text-lg font-semibold tracking-tight text-[#3A3532] leading-snug">${exec.title}</h3>
            </div>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full border border-[#E2D9CC] bg-[#F8F5F0] hover:bg-[#EFE9E0] text-[#6E6862] flex items-center justify-center text-xs transition-colors shrink-0">
              ✕
            </button>
          </div>

          <div class="mt-5 space-y-5 text-xs">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188] mb-1.5">Responsabilidad Ejecutiva</div>
              <p class="text-[#4A4541] text-[13px] leading-relaxed">${exec.mission}</p>
            </div>

            <div class="bg-[#F6F1E9] border border-[#E8DEC9] rounded-xl p-4">
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#7A353E] mb-1">Criterio Ultra-Lean</div>
              <p class="text-[#5C4E50] leading-relaxed">${exec.audit}</p>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188]">SOPs Clave Supervisados</span>
                <span class="text-[10px] text-[#A39A90]">Clic para resaltar en el mapa</span>
              </div>
              <div class="space-y-2">
                ${renderSopListInModal(exec.sops)}
              </div>
            </div>

            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188] mb-2">Indicadores Globales</div>
              <div class="flex flex-wrap gap-2">
                ${exec.kpis.map(k => `
                  <span class="px-3 py-1 rounded-full bg-[#F3EFE8] border border-[#E5DDD2] text-[#4A4541]">${k}</span>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      const role = rolesData.find(r => r.id === state.selectedRoleId);
      if (!role) return;

      const dept = DEPARTMENTS.find(d => d.id === role.dept);
      const currentStatus = role.status[state.stage];
      modal.classList.remove('hidden');

      content.innerHTML = `
        <div class="flex items-start justify-between gap-4 pb-4 border-b border-[#ECE4D8]">
          <div>
            <div class="flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[0.16em] mb-1" style="color:${dept.color}">
              <span>${dept.id} · ${dept.name}</span>
              <span>·</span>
              <span>Nivel ${role.level}</span>
            </div>
            <h3 class="text-lg font-semibold tracking-tight text-[#3A3532] leading-snug">${role.title}</h3>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full border border-[#E2D9CC] bg-[#F8F5F0] hover:bg-[#EFE9E0] text-[#6E6862] flex items-center justify-center text-xs transition-colors shrink-0">
            ✕
          </button>
        </div>

        <div class="mt-5 space-y-5 text-xs">
          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188] mb-1.5">Responsabilidad Principal</div>
            <p class="text-[#4A4541] text-[13px] leading-relaxed">${role.mission}</p>
          </div>

          <div class="bg-[#F6F1E9] border border-[#E8DEC9] rounded-xl p-4">
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#7A353E] mb-1">Criterio Ultra-Lean</div>
            <p class="text-[#5C4E50] leading-relaxed">${role.audit}</p>
          </div>

          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188] mb-2">Modalidad en etapa (${state.stage === 'hoy' ? 'Hoy' : 'Escala'})</div>
            <div class="grid grid-cols-3 gap-2">
              ${['Interno', 'Vacante', 'Externo'].map(opt => `
                <button onclick="changeRoleStatus('${role.id}', '${opt}')"
                  class="py-2 px-2.5 rounded-lg border text-center font-medium transition-all ${currentStatus === opt ? 'bg-[#7A353E] text-[#FDFBF7] border-[#7A353E]' : 'bg-white text-[#4A4541] border-[#E5DDD2] hover:border-[#7A353E]/50'}">
                  ${opt === 'Interno' ? 'Equipo Interno' : opt === 'Vacante' ? 'Por incorporar' : 'Externo'}
                </button>
              `).join('')}
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188]">SOPs Vinculados (${role.sops.length})</span>
              <span class="text-[10px] text-[#A39A90]">Clic para resaltar en el mapa</span>
            </div>
            <div class="space-y-2">
              ${renderSopListInModal(role.sops)}
            </div>
          </div>

          <div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.14em] text-[#999188] mb-2">Indicadores Clave</div>
            <div class="flex flex-wrap gap-2">
              ${role.kpis.map(k => `
                <span class="px-3 py-1 rounded-full bg-[#F3EFE8] border border-[#E5DDD2] text-[#4A4541]">${k}</span>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      renderFiltersAndSummary();
      renderCanvas();
      renderModal();
    }

    renderAll();
  </script>
</body>
</html>
